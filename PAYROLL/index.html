<style>
:root{--bg:#07173a;--bg2:#0b2250;--panel:#0f2d63;--panel2:#143a78;--gold:#d9b341;--gold2:#f0cf6a;--cell:#fff5c9;--cell2:#fdeeb0;--ink:#000;--lt:#e8eefc;--line:#c9b25a;--ok:#0b6b3a;--bad:#a4161a;--warn:#8a5200}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;font:14px/1.45 "Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--lt)}
svg.i{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px;flex:none}
#loader{position:fixed;inset:0;background:rgba(5,14,38,.72);display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;z-index:100;color:var(--gold2);font-weight:600;letter-spacing:1px}
#loader img{width:84px;height:84px;animation:spin 1.1s linear infinite;filter:drop-shadow(0 0 12px rgba(217,179,65,.55))}
@keyframes spin{to{transform:rotate(360deg)}}
.layout{display:flex;min-height:100vh}
aside{width:232px;background:linear-gradient(180deg,#051231,#0a1f4a);border-right:2px solid var(--gold);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;flex:none}
.brand{display:flex;align-items:center;gap:10px;padding:16px 14px;border-bottom:1px solid rgba(217,179,65,.35)}
.brand img{width:44px;height:44px}.brand b{display:block;color:var(--gold);letter-spacing:2px;font-size:16px}.brand span{font-size:11px;color:#aebce0}
aside nav{padding:10px 8px;display:flex;flex-direction:column;gap:3px;overflow:auto;flex:1}
aside nav button{display:flex;align-items:center;gap:11px;background:transparent;border:0;color:#cfd9f3;padding:10px 12px;border-radius:8px;cursor:pointer;font-size:13.5px;text-align:left}
aside nav button:hover{background:rgba(217,179,65,.14);color:#fff}

 for(const k in map)if(m.includes(k))return map[k]+' ('+m+')';return m}

function modal(html){const m=document.createElement('div');m.className='modal';m.innerHTML='<div>'+html+'</div>';m.addEventListener('mousedown',e=>{if(e.target===m)m.remove()});document.body.appendChild(m);return m}
function csv(rows,name){if(!rows.length)return toast('Nothing to export',true);const k=Object.keys(rows[0]);const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
 const t=[k.join(',')].concat(rows.map(r=>k.map(c=>q(typeof r[c]==='object'&&r[c]!==null?JSON.stringify(r[c]):r[c])).join(','))).join('\n');

function showLogin(msg){$('#app').innerHTML=`<div class="login-wrap"><div class="login"><img src="${LOGO_FULL}" alt="Classic Pack"><h1>PAYROLL</h1><div class="sub">Sign in to continue</div>
<label>User ID<input id="em" autocomplete="username" autocapitalize="off" placeholder="Enter your User ID"></label>
<label>Password<input id="pw" type="password" autocomplete="current-password" placeholder="Enter your password"></label>
<button class="b" id="go">${I('inn')} Log in</button>${msg?`<div class="msg err">${esc(msg)}</div>`:''}</div></div>`;
 const go=async()=>{const {error}=await sb.auth.signInWithPassword({email:(v=>v.includes('@')?v:v.toLowerCase()+'@classicpack.com')($('#em').value.trim()),password:$('#pw').value});if(error)return showLogin(error.message);start()};
 $('#go').onclick=go;$('#pw').onkeydown=e=>{if(e.key==='Enter')go()}}
async function start(){
 const {data:s}=await sb.auth.getSession();if(!s.session)return showLogin();

 if($('#eus'))$('#eus').onclick=async()=>{if(!$('#eu').value)return;await call(P('month_set_entered_up_to',{p_month:m,p_date:$('#eu').value}),'Saved');showMonth()}}

/* attendance: one day at a time + headcount */
/* ---- typed time entry: 0900 -> 09:00 AM (24-hour digits; 1830 -> 06:30 PM) ---- */
const tmParse=s=>{s=String(s||'').trim().toUpperCase();if(!s)return '';const pm=/P\s*M?$/.test(s),am=/A\s*M?$/.test(s);const d=s.replace(/[^0-9]/g,'');if(!d||d.length>4)return null;let h,m;
 if(d.length<=2){h=+d;m=0}else if(d.length===3){h=+d[0];m=+d.slice(1)}else{h=+d.slice(0,2);m=+d.slice(2)}
 if(pm&&h<12)h+=12;if(am&&h===12)h=0;if(h>23||m>59)return null;return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')};
const tmFmt=t=>{if(!t)return '';const [h,m]=t.split(':').map(Number);return String(h%12||12).padStart(2,'0')+':'+String(m).padStart(2,'0')+' '+(h<12?'AM':'PM')};
/* live Result / OT preview: same rules as the server calculation (payroll.calc_marks); the server result replaces it after Save */
function attPreview(R,grp,dateStr,tin,tout){if(!R||!tin||!tout)return null;const g=String(grp||'').trim(),rl=R.rules,sun=new Date(dateStr+'T00:00:00').getDay()===0;
 const mins=t=>{const a=t.split(':');return +a[0]*60+ +a[1]};const wm=((Math.round(mins(tout)-mins(tin))%1440)+1440)%1440;
 const sw=!!rl.migrant_sunday_rules&&sun,ms=g==='Migrant'&&sw,mg=(g==='Migrant'||g==='12 HR Migrant')&&!(g==='12 HR Migrant'&&sw);
 const sb=+rl.migrant_sunday_worked_minutes,sc=+rl.migrant_sunday_credited_minutes;const wc=ms?Math.round(Math.min(wm,sb)*sc/sb):wm;
 const shiftMin=()=>{const di=mins(tin)*60/86400,fr=x=>x-Math.floor(x);let best=null;(R.shifts||[]).filter(x=>x.active).forEach(x=>{const ds=mins(String(x.start_time).slice(0,5))*60/86400;const d=Math.min(fr(di-ds),fr(ds-di));if(!best||d<best.d||(d===best.d&&x.code<best.c))best={d,c:x.code,m:Math.round(x.hours*60)}});return best?best.m:0};
 const xm=ms?Math.round(Math.min(wm,sb)*(sc-sb)/sb)+Math.max(0,wm-sb):wm-(!sun&&g==='Migrant'?+rl.migrant_weekday_ot_after_minutes:!sun&&g==='12 HR Migrant'?+rl.migrant_12hr_staff_minutes:shiftMin());
 const code=wc>=(mg?+rl.p_limit_minutes_migrant:+rl.p_limit_minutes_non_migrant)?'P':wc>=(mg?+rl.hd_limit_minutes_migrant:+rl.hd_limit_minutes_non_migrant)?'HD':'L';
 const blk=Math.round(+rl.ot_block_hours*60),gr=+rl.ot_grace_minutes;const ot=xm<blk?0:Math.floor((xm+gr)/blk)*blk/60;return {code,ot}}
VIEWS.attendance=async()=>{
 const today=new Date().toISOString().slice(0,10);
 $('#main').innerHTML=`<div class="card"><h2>Daily attendance</h2><div class="row noprint">
 <label>Date<input type="date" id="ad" value="${(window._ad)||today}"></label>
 <label>Contractor<select id="ac"><option value="">— choose —</option></select></label>
 <label>Search<input id="as" placeholder="ID or name"></label><button class="b l" id="ar">${bt('search','Load')}</button><button class="b l" id="adl" title="Download the month attendance, compressed, without In / Out">${bt('dl','Download month Excel')}</button></div><div id="ab" style="margin-top:10px"></div></div>
 <div class="card"><h2>Physical headcount</h2><div id="hc" class="mut">Choose a date.</div></div>`;
 const loadC=async()=>{const m=monthStart($('#ad').value);const {data}=await P('month_get',{p_month:m});
  if(!data){$('#ac').innerHTML='<option value="">Month not open — open it in Months</option>';return false}

 await loadC();
 $('#ad').onchange=async()=>{window._ad=$('#ad').value;CUR_MONTH=monthStart($('#ad').value);await loadC();loadDay();loadHC()};
 $('#ac').onchange=()=>{window._ac=$('#ac').value;loadDay()};$('#ar').onclick=()=>{loadDay();loadHC()};$('#adl').onclick=async()=>{CUR_MONTH=monthStart($('#ad').value);const c=$('#ac').value;try{await dlAttendance(c&&c!=='all'?c:'',true)}catch(e){toast(cleanErr(e.message||String(e)),true)}};$('#as').oninput=()=>loadDay(true);
 let DATA=null,PEND={},SEL=new Set(),RULES=null;
 async function loadDay(keep){const c=$('#ac').value;if(!c){$('#ab').innerHTML='<span class="mut">Choose a contractor (or All contractors).</span>';return}
  const d=$('#ad').value,m=monthStart(d),dn=Number(d.slice(8));
  if(!keep||!DATA||DATA.m!==m||DATA.c!==c){const r=await call(P('attendance_get',{p_month:m,p_contractor:c==='all'?null:Number(c)}));DATA={m,c,r};PEND={};SEL=new Set();try{const rr=await P('att_rules',{p_month:m});RULES=rr.error?null:rr.data}catch(_){RULES=null}}
  const q=$('#as').value.toLowerCase();const st=DATA.r.month?.status;const edit=can('attendance_edit');const lock=st==='Locked';
  const base=x=>{const dd=x.days.find(z=>z.d===dn)||{};return {in:dd.in||'',out:dd.out||'',cd:(dd.manual&&dd.code)||'',rs:dd.reason||'',dd}};
  const cur=x=>Object.assign({},base(x),PEND[x.emp_id]||{});
  const changed=x=>{const b=base(x),p=cur(x);return p.in!==b.in||p.out!==b.out||p.cd!==b.cd||p.rs!==b.rs};
  const rows=DATA.r.rows.filter(x=>!q||x.emp_id.toLowerCase().includes(q)||x.name.toLowerCase().includes(q));
  const allSel=rows.length&&rows.every(x=>SEL.has(x.emp_id));
  const counts=()=>{const n=DATA.r.rows.filter(changed).length;const e=$('#bn');if(e)e.textContent=SEL.size+' selected · '+n+' unsaved change(s)'};
  $('#ab').innerHTML=`${lock?'':`<div class="row noprint bulk"><b style="color:#f0cf6a">${I('users')} Bulk entry</b>
  <label>In<input class="tm" id="bi" inputmode="numeric" placeholder="hhmm" autocomplete="off"></label><label>Out<input class="tm" id="bo" inputmode="numeric" placeholder="hhmm" autocomplete="off"></label>
  <label class="ck"><input type="checkbox" id="bs" checked> Skip rows already entered</label>
  <button class="b" id="ba">${bt('check','Apply to selected')}</button><button class="b l" id="bc">${bt('x','Clear selected')}</button>
  <button class="b l" id="bsa">${bt('plus','Select all shown')}</button><button class="b l" id="bsn">Select none</button><span class="mut" id="bn"></span></div>`}
  <div class="row noprint" style="margin:0 0 6px;gap:2px;align-items:center">${LEGEND}<span class="ac ac-OT">1.5</span> <span class="mut">OT hours</span></div><div class="scroll"><table><tr><th><input type="checkbox" id="sa" ${allSel?'checked':''} ${lock?'disabled':''}></th><th>ID</th><th>Name</th>${c==='all'?'<th>Contractor</th>':''}<th>Group</th><th>In</th><th>Out</th>${edit?'<th>Manual code</th><th>Reason</th>':''}<th>Result</th><th>OT</th></tr>
  ${rows.map(x=>{const b=base(x),p=cur(x),dd=b.dd,cl=changed(x)?' pd':'';const con=(CONTRACTORS.find(k=>k.contractor_id===x.contractor_id)||{}).name||'';return `<tr data-e="${x.emp_id}"><td><input type="checkbox" class="sel" ${SEL.has(x.emp_id)?'checked':''} ${lock?'disabled':''}></td><td>${x.emp_id}</td><td>${esc(x.name)}${x.review_required?' <span class="tag warn">review</span>':''}</td>${c==='all'?`<td>${esc(con)}</td>`:''}<td>${esc(x.grp)}</td>
  <td><input class="tm in${cl}" value="${tmFmt(p.in)}" data-v="${p.in}" inputmode="numeric" placeholder="hhmm" autocomplete="off" ${lock?'disabled':''}></td><td><input class="tm out${cl}" value="${tmFmt(p.out)}" data-v="${p.out}" inputmode="numeric" placeholder="hhmm" autocomplete="off" ${lock?'disabled':''}></td>
  ${edit?`<td><select class="cd${cl}"><option></option>${['P','HD','L','LOP','ESI-L','CO','OFF','NH/PH'].map(k=>`<option ${p.cd===k?'selected':''}>${k}</option>`).join('')}</select></td><td><input class="rs${cl}" style="width:130px" value="${esc(p.rs)}"></td>`:''}
  <td class="rc">${dd.code?`<span class="ac ac-${dd.code.replace(/[^A-Za-z]/g,'')}" title="${esc(ACN[dd.code]||dd.code)}${dd.manual?' (manual)':''}">${dd.code}${dd.manual?' •':''}</span>`:''}</td><td class="ro">${dd.ot?`<span class="ac ac-OT">${dd.ot}</span>`:''}</td></tr>`}).join('')}</table></div>
  <div class="row noprint" style="margin-top:10px"><button class="b" id="sv" ${lock?'disabled':''}>${bt('save','Save day')}</button><span class="mut">${rows.length} employees shown. Blank In & Out clears the entry. Weekly-offs and holidays fill in automatically.</span></div>`;
  counts();
  const ab=$('#ab');
  ab.onchange=ev=>{const t=ev.target;
   if(t.id==='sa'){rows.forEach(x=>t.checked?SEL.add(x.emp_id):SEL.delete(x.emp_id));ab.querySelectorAll('.sel').forEach(k=>k.checked=t.checked);counts();return}
   const tr=t.closest('tr[data-e]');if(!tr)return;const e=tr.dataset.e;
   if(t.classList.contains('sel')){t.checked?SEL.add(e):SEL.delete(e);counts();return}
   if(['in','out','cd','rs'].some(k=>t.classList.contains(k))){const gv=el=>{const r=tmParse(el.value);if(r===null){el.style.outline='2px solid #b3261e';toast('Time not understood. Type like 0900 or 1830',true);return el.dataset.v||''}el.style.outline='';el.value=tmFmt(r);el.dataset.v=r;return r};
    PEND[e]={in:gv(tr.querySelector('.in')),out:gv(tr.querySelector('.out')),cd:tr.querySelector('.cd')?.value||'',rs:tr.querySelector('.rs')?.value||''};
    const x=DATA.r.rows.find(z=>z.emp_id===e);tr.querySelectorAll('.in,.out,.cd,.rs').forEach(k=>k.classList.toggle('pd',changed(x)));counts()}};
  ab.oninput=ev=>{const t=ev.target;if(!t.classList.contains('tm'))return;const tr=t.closest('tr[data-e]');if(!tr)return;const a=tmParse(tr.querySelector('.in').value),b=tmParse(tr.querySelector('.out').value);
   const x=DATA.r.rows.find(z=>z.emp_id===tr.dataset.e);const pv=(a&&b)?attPreview(RULES,x.grp,$('#ad').value,a,b):null;
   if(pv){tr.querySelector('.rc').innerHTML=`<span class="ac ac-${pv.code}" style="opacity:.8" title="Preview - saved with Save day">${pv.code}</span>`;tr.querySelector('.ro').innerHTML=pv.ot?`<span class="ac ac-OT" style="opacity:.8" title="Preview">${pv.ot}</span>`:''}};
  ab.onkeydown=ev=>{if(ev.key!=='Enter'||!ev.target.classList.contains('tm'))return;ev.preventDefault();ev.target.dispatchEvent(new Event('change',{bubbles:true}));const all=[...ab.querySelectorAll('input.tm:not([disabled])')];const i=all.indexOf(ev.target);if(all[i+1]){all[i+1].focus();all[i+1].select()}};
  if($('#ba')){
   $('#bsa').onclick=()=>{rows.forEach(x=>SEL.add(x.emp_id));loadDay(true)};$('#bsn').onclick=()=>{SEL=new Set();loadDay(true)};
   $('#ba').onclick=()=>{const bi=tmParse($('#bi').value),bo=tmParse($('#bo').value);if(bi===null||bo===null)return toast('Time not understood. Type like 0900 or 1830',true);$('#bi').value=tmFmt(bi);$('#bo').value=tmFmt(bo);if(!SEL.size)return toast('Select employees first (tick the boxes, or use Select all shown)',true);if(!bi||!bo)return toast('Enter both In and Out time',true);
    const skip=$('#bs').checked;let n=0,sk=0;SEL.forEach(e=>{const x=DATA.r.rows.find(z=>z.emp_id===e);if(!x)return;const p=cur(x);if(skip&&(p.in||p.out)){sk++;return}PEND[e]=Object.assign({},p,{in:bi,out:bo});n++});
    toast(`Applied to ${n}${sk?`, skipped ${sk} already entered`:''}. Review, then press Save day.`);loadDay(true)};
   $('#bc').onclick=()=>{if(!SEL.size)return toast('Select employees first',true);if(!confirm('Clear In/Out for '+SEL.size+' selected employee(s)?'))return;SEL.forEach(e=>{const x=DATA.r.rows.find(z=>z.emp_id===e);if(x)PEND[e]=Object.assign({},cur(x),{in:'',out:''})});loadDay(true)}}
  $('#sv').onclick=async()=>{const out=[];DATA.r.rows.forEach(x=>{if(!PEND[x.emp_id]||!changed(x))return;const p=cur(x);out.push({emp_id:x.emp_id,date:d,in:p.in,out:p.out,code:p.cd,reason:p.rs})});

   if(r.error&&String(r.error.message).includes('headcount_exceeded')&&can('headcount_override')){const ov=prompt(cleanErr(r.error.message)+'\n\nOverride reason (min 5 characters):');if(!ov)return;r=await P('attendance_save',{p_month:m,p_rows:out,p_override_reason:ov})}
   if(r.error)return toast(cleanErr(r.error.message),true);
   toast('Saved '+r.data.saved+' (cleared '+r.data.cleared+')');DATA=null;loadDay();loadHC()}}
 async function loadHC(){const d=$('#ad').value;if(!d)return;const {data,error}=await P('headcount_status',{p_date:d});if(error){$('#hc').innerHTML=esc(cleanErr(error.message));return}

GISTER AZ / BA / BB and on the SALARY SLIP. Information only – pay already excludes these days.", "L 14 + forfeited NH/PH 1 → Leave 14, Unpaid 1, Total Unpaid Leaves 15"], ["6. ONE DAY'S PAY — DAILY vs MONTHLY PAY TYPE"], ["Item", "Daily pay type", "Monthly pay type", "Current value", "Note"], ["Day Basic", "Basic rate (as entered)", "Monthly Basic ÷ calendar days in the month (Sep 30, Oct 31, Feb 28)"], ["Day HRA", "HRA rate (as entered)", "Monthly HRA ÷ calendar days in the month"], ["★ Example — one day", "Basic 400 + HRA 100 → ₹500 per day", "Basic 15,600 + HRA 2,600 in Sep (30 days) → 520 + 86.67 = ₹606.67 per day.  In Oct (31 days) → 503.23 + 83.87 = ₹587.10 per day"], ["Earned for the month", "Day Basic × Payment Days (rounded)", "Monthly Basic ÷ days in month × Payment Days (rounded). Full month paid = exactly the monthly salary."], ["OT hourly base", "Day Basic ÷ 8", "Monthly Basic ÷ 26 ÷ 8 (FIXED 26 days, not calendar days)", "26"], ["★ Why two divisors?", "—", "Day pay uses calendar days so a full month equals the monthly salary. OT uses a fixed 26 working days so the OT rate is the same every month."], ["NH/PH worked premium", "Day Basic × 2", "(Monthly Basic ÷ days in month) × 2"], ["Sunday work / Incentive", "Fixed ₹ per day from the rate", "Fixed ₹ per day from the rate (not divided)"], ["7. BASIC & HRA"], ["★ Earned Basic", "Day Basic × Payment Days, rounded to the rupee. If a Weekly Off Rate is set for the employee, the paid weekly off days are taken out here and paid at the Weekly Off Rate instead (section 12).", "Daily 400 × 26 payment days = ₹10,400"], ["Earned HRA", "Same as Earned Basic, using Day HRA.", "Daily 100 × 26 = ₹2,600"], ["Rate source", "The SALARY RATE HISTORY row applied for the month (its date shows in SALARY REGISTER col AC). If none, EM rates."], ["8. INCENTIVE"], ["Rule", "Incentive = Incentive per day × Present Days.", "20 × 22 present days = ₹440"], ["★ Exception — contractors starting with the prefix in col D", "Incentive is fed hours of that day's shift. Night shifts crossing midnight are handled (19:00 → 03:30 = 8:30 worked). JAN–SEP use the old standard-hours method. Migrant: OT after 8:00 on weekdays; 12 HR Migrant: OT after 12:00 on weekdays (next row).", "Shift 1 (09:00–17:30, 8:30): In 09:15, Out 18:35 → worked 9:20 → extra 0:50"], ["★ Migrant & 12 HR Migrant — weekday OT (OCT–DEC)", "Mon–Sat, any shift, same 30-min blocks and 5-min grace. MIGRANT: OT = hours worked − 8:00, so a 12-hour day automatically gives 4 OT hours. 12 HR MIGRANT: OT = hours worked − 12:00 (12 hours = normal present day; hours recorded, normal OT not paid). P / HD limits unchanged (P ≥ 11:00, HD ≥ 5:00). Sunday: see section 10.", "Migrant, In 08:00: Out 20:00 (12:00) → P, OT 4.0;  Out 19:00 (11:00) → OT 3.0;  Out 21:00 (13:00) → OT 5.0.  12 HR Migrant: Out 20:00 → OT 0;  Out 21:00 → OT 1.0", "Migrant 8:00 / 12 HR 12:00", "Name MG_WkOTAfterHrs (Migrant, 8:00); SHIFT SETTINGS B52 (12 HR Migrant, 12:00)"], ["★ Shift picked automatically", "Each day the shift whose Start time is nearest to the In time is used. Shifts (up to 9) and their Staffed hours are on SHIFT SETTINGS rows 6–14; Staffed hours = End − Start.", "In 06:10 → Shift 2 (06:00–14:00, 8:00); In 18:50 → Shift 4 (19:00–03:00, 8:00)"], ["★ OT rounding & grace", "OT is paid in blocks of 30 min (OT rounding). Less than one full block → no OT. From the 2nd block onwards, a grace of 5 min (SHIFT SETTINGS B15) counts as the next block.", "28 min → 0; 50 min → 0.5; 55 min → 1.0; 1:25 → 1.5; 1:55 → 2.0", "30 min / 5 min grace"], ["★ P / HD / L from worked hours", "Non Migrant: P if worked ≥ 6:30, HD if ≥ 3:45, else L. Migrant & 12 HR Migrant: P ≥ 11:00, HD ≥ 5:00, else L. Only In or only Out entered → CHECK (red). Sundays OCT–DEC: special rules for 12 HR Migrant and Migrant (section 10).", "Non Migrant worked 9:20 → P; Migrant worked 9:20 → HD"], ["Late coming", "No late-coming penalty. A late In only reduces the worked hours and the OT.", "Shift 1, In 09:15 → no deduction; OT counted from actual hours"], ["10. SUNDAY WORK"], ["★ Sunday Work Pay", "Sunday Work Rate per day × Sundays worked (P = 1, HD = 0.5). Paid only when the employee has a Sunday rate. Rate blank / 0 → nothing extra.", "Rate 100, worked 3 Sundays → ₹300 extra"], ["Basic for the Sunday", "The Sunday worked is also a Present day, so normal Basic + HRA is paid too. Sunday pay is EXTRA on top.", "Daily 400 + 100 + Sunday 100 = ₹600 for that Sunday"], ["OT on Sunday", "Normal OT rate. Exception (OCT–DEC): Migrant Sunday OT is calculated with the Migrant Sunday rule — see below."], ["★ Sunday rule switch (OCT–DEC)", "SHIFT SETTINGS B47 = Yes turns ON the two Sunday rules below for 12 HR Migrant and Migrant. No = Migrant limits (P 11:00 / HD 5:00) and normal OT every day. Non Migrant is never affected.", "B47 = No → Sunday marked like any other day", "Yes"], ["★ 12 HR Migrant — Sunday P / HD / L", "On Sundays, marked with the NON-MIGRANT limits: P if worked ≥ 6:30, HD if ≥ 3:45, else L. OT unchanged (worked − shift hours; 12 HR Migrant normal OT not paid).", "Worked 8:00 on Sunday → P (weekday 8:00 → HD)"], ["★ Migrant — Sunday credited hours", "Hours worked up to 8:00 are credited × 12 ÷ 8 (max 12:00). Credited hours are checked against the Migrant limits (P ≥ 11:00, HD ≥ 5:00). In worked hours: P from 7:20, HD from 3:20, else L. Credited hours are not shown on the sheet — they only decide the code.", "8:00 → 12:00 → P;  7:30 → 11:15 → P;  7:00 → 10:30 → HD;  3:30 → 5:15 → HD;  3:00 → 4:30 → L", "8:00 → 12:00"], ["★ Migrant — Sunday OT", "First 8:00 worked earn OT at (12 − 8) ÷ 8 = ½ hour per hour (8 hrs worked → 4 OT, pro-rata below 8), plus every hour beyond 8:00 counted 1:1. Same 30-min blocks and 5-min grace. Filled automatically in the OT cell → OT Hours total → OT Pay. Pay for that Sunday = 1 Present day + Sunday Work Pay (if rate set) + OT.", "7:00 → OT 3.5;  8:00 → OT 4.0;  8:30 → OT 4.5;  10:00 → OT 6.0 (4 + 2)", "8:00 → 4 OT"], ["11. NH / PH HOLIDAYS"], ["Situation", "Rule", "Example", "Current value"], ["Which days are holidays", "Dates on HOLIDAY CALENDAR with Applicable = Yes (section 20)."], ["Is the employee eligible (not-worked holiday)?", "Checked in order: EM 'NH / PH Applicable' → CONTRACTOR RATES 'NH / PH Applicable' → default setting (col D). Current EM setting: Non Migrant = Yes; Migrant and 12 HR Migrant = No.", "Non Migrant → Yes; Migrant / 12 HR Migrant → No", "Yes", "EM col AK / CONTRACTOR RATES col M / SETUP B20"], ["★ Holiday NOT worked (mark NH/PH)", "NON MIGRANT (NH/PH Applicable = Yes): paid as 1 normal day (Basic + HRA), counted in Payment Days, unless forfeited.  MIGRANT / 12 HR MIGRANT (NH/PH Applicable = No): NOT paid – no Basic, HRA or NH/PH pay for that day; not added to Payment Days (same as absent). The NH/PH mark still counts toward the Weekly Off 4-day rule.", "Non Migrant daily 400 + 100 → ₹500.  Migrant marked NH/PH → ₹0"], ["★ When NH/PH is NOT paid (forfeited)", "Forfeited when the employee is NOT present (P/HD) on ANY of the 2 days before AND the 2 days after the holiday. Present on even ONE of those 4 days → holiday is paid. Days outside the month count as not present. Not-eligible employees are never paid a not-worked holiday.", "Holiday 15-Aug: absent 13, 14, 16, 17 → NOT paid.  Present on 14-Aug only → paid"], ["★ Holiday WORKED (mark P)", "Normal day pay (it is a present day) + holiday premium of Day Basic × 2. The premium is paid to EVERYONE who works a holiday – Non Migrant, Migrant and 12 HR Migrant (NH/PH Applicable does not matter when the holiday is worked).", "Daily Basic 400: ₹400 + ₹100 HRA + ₹800 premium (any group)"], ["Holiday OT", "OT hours on a worked holiday are paid at Day Basic ÷ 8 × 2 per hour (all groups, incl. 12 HR Migrant) and are removed from normal OT.", "Basic 400, 3 OT hrs → 400 ÷ 8 × 2 × 3 = ₹300", "8"], ["Monthly pay type", "Day Basic = Monthly Basic ÷ days in month.", "15,600 in Aug (31 days): 503.23 × 2 = ₹1,006 premium; holiday OT 503.23 ÷ 8 × 2 = ₹125.81 per hour"], ["12. WEEKLY OFF"], ["Paid Weekly Off = Yes", "Each OFF day is paid as a normal day (Basic + HRA) and counted in Payment Days.", "4 OFF → 4 paid days"], ["Paid Weekly Off = No", "OFF days are not paid."], ["★ Sandwich rule", "An OFF day is NOT paid when the employee is not present (P/HD) on the day before AND the day after it.", "L on Sat, OFF on Sun, L on Mon → Sunday OFF not paid"], ["★ Weekly Off 4-day rule", "A Sunday OFF is paid only if the employee has at least 4 working days (P, HD or paid NH/PH – each counts 1) in the Mon–Sat after that Sunday. Otherwise the Sunday OFF is NOT paid. Minimum days / week length are set on SHIFT SETTINGS (B30, B31).", "OFF Sun 6-Sep; P Mon, P Tue, P Wed, L Thu–Sat → 3 days < 4 → Sunday OFF not paid"], ["Last Sunday of the month", "Only the days inside the month are checked and the 4 days are reduced in proportion: required = ROUNDUP(4 × days in month ÷ 6). Days after 'Attendance entered up to' (EU3 on each attendance sheet) are not yet counted. A weekday comp-off (given for a worked Sunday) is always paid.", "Sun 27-Sep: 28–30 Sep in month (3 days) → needs 2 days; Sun 30-Aug: only 31-Aug → needs 1 day"], ["Weekly Off Rate", "If a Weekly Off Rate / Day is set, weekly off days are paid at that rate instead of Basic + HRA. At present no employee in EM has a weekly off rate."], ["★ Comp Off – earning (JUN–DEC)", "Only for Paid Weekly Off = Yes. For every FULL Sun–Sat week inside the month where the employee is P on all 7 days, 1 Comp Off is earned. HD does not count. Part weeks at the start / end of the month are ignored. Paid Weekly Off = No (e.g. most 12 HR Migrants) → no Comp Off.", "Sep 2026: full weeks 6–12, 13–19, 20–26. P on all 7 days in 2 of them → 2 Comp Off"], ["★ Comp Off – using (code CO)", "A leave day (L) can be changed to CO in the Att. cell. A CO day is paid as a normal day (Basic + HRA) and counted in Total Payment Days, which never exceed the days in the month. CO can be selected only while Comp Off Balance > 0; at 0 the balance cell turns grey and CO is not accepted.", "2 earned; L on 8-Sep → CO (balance 1); L on 22-Sep → CO (balance 0); next CO is refused"], ["★ Comp Off – balance paid as OT", "Comp Off Balance at month end is converted to OT: balance × 8 hours (SHIFT SETTINGS B16) × the employee's OT rate (section 9). ★ Paid EVEN IF 'OT Applicable' = No (e.g. Monthly staff) and for 12 HR Migrant – normal OT stays unpaid, but Comp Off OT is always paid. Rate used: Non Migrant = Basic ÷ 8 × 1.5 (Monthly: Basic ÷ 26 ÷ 8 × 1.5); Migrant / 12 HR Migrant = (Basic + HRA + Incentive) ÷ 8 (Monthly: (Basic + HRA) ÷ 26 + Incentive, ÷ 8).", "1 balance → 8 hrs × ₹56.25 = ₹450"], ["Where Comp Off shows", "Attendance sheet: EV Earned, EW Used (CO), EX Balance, EY Comp Off OT Hours. SALARY REGISTER: AU–AY. SALARY SLIP: Comp Off days and Comp Off OT under OT Pay, Comp Off Used / Balance next to Total Payment Days, and a remark."], ["13. FOOD ALLOWANCE"], ["★ Who gets it", "Only FEMALE employees in Group 'Non Migrant'. Everyone else — nil."], ["Rule", "Allowance per day (col D) for every day on which that day's OT entry is at or above the minimum hours.", "6 days with OT ≥ 4 hrs → 6 × 40 = ₹240", "40"], ["Minimum OT hours per day", "The OT on that single day must be ≥ this value.", "3.5 hrs → no allowance for that day", "4"], ["In Gross?", "Yes, part of Gross. Not part of PF / ESI wages."], ["14. ATTENDANCE ALLOWANCE"], ["★ Who gets it", "Only FEMALE employees in Group 'Non Migrant'."], ["Full month", "Present Days ≥ number of days in the month → full allowance.", "Sep: 30 present → ₹300", "300"], ["All working days", "Present Days ≥ (days in month − Sundays in month) → this allowance.", "Sep (4 Sundays): 26 to 29.5 present → ₹100", "100"], ["Otherwise", "Nil. Only present days count (P + ½ HD); paid OFF / NH/PH days do not count.", "Sep: 25 present → ₹0"], ["In Gross?", "Yes, part of Gross. Not part of PF / ESI wages."], ["15. OTHER PAY & DEDUCTIONS"], ["Other Pay", "Typed in the attendance sheet (col EE) for that month only. Added AFTER deductions. Not part of Gross, PF or ESI.", "Other Pay 500 → Net +₹500"], ["Other Deduction", "Typed in the attendance sheet (col EF). Deducted along with PF and ESI."], ["Asset Deduction", "Shoe + Uniform + Coat deduction from EM, deducted ONLY in the month of the employee's 'Inactive From' date."], ["16. PF, ESI, GROSS, NET, STATUS"], ["Gross Salary", "Earned Basic + Earned HRA + Incentive + OT Pay + Sunday Pay + Weekly Off Pay + NH/PH Pay + Food Allowance + Attendance Allowance."], ["★ PF (employee)", "Earned Basic × PF rate — only if EM 'PF Applicable' = Yes.", "10,400 × 12% = ₹1,248", "0.12"], ["★ ESI (employee)", "(Earned Basic + Earned HRA + OT Pay + Comp Off OT Pay) × ESI rate — only if EM 'ESI Applicable' = Yes.", "(10,400 + 2,600 + 1,000) × 0.75% = ₹105", "0.0075"], ["Total Deduction", "PF + ESI + Other Deduction + Asset Deduction."], ["Net Salary", "Gross − Total Deduction + Other Pay."], ["Rounding", "Each earning and deduction is rounded to the nearest rupee."], ["Status", "NO ATTENDANCE = no present days and no paid weekly offs.  CHECK RATE = EM 'Review Required' = Yes.  Otherwise READY."], ["Employer PF", "Earned Basic × employer PF rate (CONTRACTOR SUMMARY).", "0.13"], ["Employer ESI", "Gross × employer ESI rate (CONTRACTOR SUMMARY).", "0.0325"], ["17. SALARY RATE HISTORY"], ["★ Golden rule", "Every rate change = a NEW row. Never edit or delete an old row — past months' pay would change."], ["Which row is used", "Latest Effective From ON or BEFORE the LAST day of the payroll month. A row dated anywhere inside a month applies to that WHOLE month, so always use the 1st of the month.", "Row dated 15-Sep → used for all of September"], ["No row for the employee", "EM rates are used (fallback)."], ["Columns used for pay", "Basic Rate, HRA Rate, Incentive / Day, Sunday Work Rate / Day, Weekly Off Rate / Day."], ["Columns NOT used for pay", "OT Rate / Hour and NH Rate / Hour — reference only (section 24)."], ["Check column", "Shows 'Unknown Employee ID' or 'Duplicate ID + date' — fix before running payroll."], ["Gross / PF / ESI / Net preview", "Information only: daily rates × Salary Days Basis days. Not used by the actual payroll.", "(400 + 100) × 26 = ₹13,000 preview gross", "26"], ["18. SALARY REVISION (bulk rate change)"], ["Purpose", "Wizard for many employees: set the effective month, the daily increase for Basic and HRA (Male / Female), and the % for monthly staff. Use Override columns for exceptions; Include = No to skip someone."], ["Posting", "Posts NEW dated rows to SALARY RATE HISTORY, with a Batch ID in Remarks."], ["★ Undo", "Use the UNDO LAST REVISION / UNDO BATCH buttons — never Ctrl+Z. Never edit the Remarks (Batch ID) of a posted row."], ["File type", "Always save as .xlsm (macro-enabled) or the buttons are lost."], ["23. PAID / NOT PAID — QUICK CHECK"], ["Situation", "Paid?", "What is paid"], ["P — present", "YES", "1 day Basic + HRA (+ incentive)"], ["HD — half day", "YES (half)", "0.5 day Basic + HRA"], ["L / LOP / ESI-L", "NO", "Nothing"], ["Unpaid OFF / forfeited NH/PH", "NO", "Counted in Unpaid Days (EH) and Total Unpaid Leaves (EZ)"], ["Van charges", "INVOICE only", "Not part of employee pay – billed to the contractor (section 21)"], ["OFF — Paid Weekly Off = Yes, present before or after", "YES", "1 day Basic + HRA"], ["★ OFF — absent the day before AND the day after", "NO", "Sandwich rule"], ["★ Sunday OFF — fewer than 4 working days (P/HD/NH/PH) in the Mon–Sat after it", "NO", "Weekly Off 4-day rule (last week of month: proportional)"], ["OFF — Paid Weekly Off = No", "NO", "Nothing"], ["NH/PH — eligible, present on any of the 2 days before / 2 days after", "YES", "1 day Basic + HRA"], ["★ NH/PH — absent on all 2 days before and 2 days after", "NO", "Forfeited"], ["★ NH/PH — Migrant / 12 HR Migrant (or any employee / contractor with NH/PH Applicable = No) – not worked", "NO", "Nothing – paid only if they WORK the holiday (mark P / HD), see next row"], ["★ Worked on a holiday (P) – all groups incl. Migrant & 12 HR Migrant", "YES", "Day pay + Day Basic × 2 premium + holiday OT at Day Basic ÷ 8 × 2"], ["Worked on a Sunday", "YES", "Day pay + Sunday rate (if a Sunday rate is set)"], ["★ Migrant worked a Sunday (OCT–DEC, switch = Yes)", "YES", "8 hrs worked = 12 hrs credited → P (1 day pay) + Sunday rate + OT (8 hrs → 4 OT, 7 hrs → 3.5, 10 hrs → 6)"], ["★ Comp Off (CO) used on a leave day — Paid Weekly Off = Yes, JUN–DEC", "YES", "Paid as 1 normal day (Basic + HRA); counted in Total Payment Days (max = days in month)"], ["★ Comp Off balance unused at month end", "YES (as OT)", "Balance × 8 OT hours at the employee's OT rate – paid even when OT Applicable = No / 12 HR Migrant"], ["OT — Non Migrant / Migrant", "YES", "OT rate × hours (section 9)"], ["★ OT — less than 30 min extra after the shift (OCT–DEC)", "NO", "OT only from 30 min; 55 min = 1 hr (5 min grace from the 2nd block)"], ["★ OT — Migrant / 12 HR Migrant on a weekday (OCT–DEC)", "Migrant: after 8 hrs | 12 HR Migrant: after 12 hrs", "Migrant: 12 hrs → 4 OT, 11 hrs → 3, 13 hrs → 5. 12 HR Migrant: OT only beyond 12:00, and normal OT still not paid"], ["★ OT — 12 HR Migrant", "NO", "Normal OT not paid (holiday OT is paid)"], ["Food / attendance allowance — male or migrant", "NO", "Nothing"], ["Days before joining / after relieving", "NO", "Leave these dates blank"], ["24. FIELDS NOT USED IN PAY (reference only)"], ["OT Rate / Hour", "EM col S and SALARY RATE HISTORY col G. Not used — OT is calculated from Basic (section 9)."], ["NH Rate / Hour", "EM col U and SALARY RATE HISTORY col I. Not used — holiday OT is Day Basic ÷ 8 × 2 (section 11)."], ["SALARY REGISTER AG / AI", "Show the history values of the two fields above for reference only."], ["Removed settings", "The settings 'Sunday work divisor' and 'NH / PH OT multiplier' were listed on SETUP & GUIDE but no formula used them. They have been removed to avoid confusion." function code39(text){const t='*'+String(text).toUpperCase().replace(/[^0-9A-Z\-. ]/g,'-')+'*';let x=0,r='';
 for(const ch of t){const p=C39[ch];for(let i=0;i<9;i++){const w=p[i]==='w'?3:1;if(i%2===0)r+=`<rect x="${x}" y="0" width="${w}" height="40" fill="#000"/>`;x+=w}x+=1}

function compressPhoto(file){return new Promise((res,rej)=>{const img=new Image();const u=URL.createObjectURL(file);img.onload=()=>{
  const W=270,H=340,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,W,H);
  const r=Math.max(W/img.width,H/img.height),w=img.width*r,h=img.height*r;x.drawImage(img,(W-w)/2,(H-h)/2,w,h);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',.82))};
  img.onerror=()=>rej(new Error('Could not read this image'));img.src=u})}
const IDCSS=`*{box-sizing:border-box}.idc{width:54mm;height:86mm;border-radius:3.5mm;position:relative;overflow:hidden;font-family:"Segoe UI",Arial,sans-serif;-webkit-print-color-adjust:exact;print-color-adjust:exact}

/* ===== report engine ported from the Export Centre HTML (Attendance / Monthly Billing / Register downloads) ===== */
const BB=(function(){
const num=v=>{const n=parseFloat(v);return isNaN(n)?0:n},q2=v=>v==null?'':(Math.round(v*100)/100).toLocaleString('en-US'),pct=v=>(v*100).toFixed(2)+'%',money0=v=>'₹'+Math.round(v).toLocaleString('en-US'),money=v=>Math.round(v).toLocaleString('en-IN'),esc=v=>v==null?'':String(v).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function bbRound(x){                       // Excel-style ROUND(x,0): half away from zero, 15-digit precision
  if(!isFinite(x)) return 0;
  const y=Number(Math.abs(x).toPrecision(15));
  return (x<0?-1:1)*Math.round(y);
}

function bbWk(a){ return a==='P'?1:(a==='HD'?0.5:0); }

function bbWorked(a){ return a==='P'||a==='HD'; }

function bbCalcAtt(e,days,dim,S,monthStart,entryUpTo){
  const att=e.att, ot=e.ot, n=days.length, x={};
  const W=a=>a==='P'?1:(a==='HD'?0.5:0), worked=a=>a==='P'||a==='HD';
  const dn=d=>Math.floor(d.getTime()/864e5);
  x.present=att.reduce((t,a)=>t+W(a),0);
  x.otHours=ot.reduce((t,v)=>t+v,0);
  // ---- Sunday days. From "Sunday extra-day rule applies from": a worked Sunday counts only if NO weekday OFF in the following 6 days
  const sunRule=!!(S.sundayRuleFrom && monthStart>=S.sundayRuleFrom);
  x.sunday=0; x.nhWorked=0; x.nhOt=0;
  days.forEach((d,i)=>{
    const w=W(att[i]);
    if(d.sunday && w){
      let offsAfter=0; if(sunRule){ for(let k=i+1;k<=Math.min(n-1,i+6);k++) if(att[k]==='OFF') offsAfter++; }
      if(!offsAfter) x.sunday+=w;
    }
    if(d.nh){ x.nhWorked+=w; if(worked(att[i])) x.nhOt+=ot[i]; }
  });
  const eligible=(e.gender==='Female' && String(e.group).trim()==='Non Migrant');
  x.food = eligible ? ot.filter(v=>v>=S.foodMinOT).length*S.foodPerDay : 0;
  if(!eligible) x.attAllow=0;
  else if(x.present>=dim) x.attAllow=S.attFull;
  else {
    const wd=((monthStart.getUTCDay()+6)%7)+1;                       // WEEKDAY(first day,2)
    x.attAllow = x.present>=dim-Math.floor((dim-1+wd)/7) ? S.attWork : 0;
  }
  const cnt=c=>att.filter(a=>a===c).length;
  x.off=cnt('OFF'); x.leave=cnt('L'); x.lop=cnt('LOP'); x.esil=cnt('ESI-L'); x.nhDays=cnt('NH/PH'); x.co=cnt('CO');
  x.unpaid=x.lop+x.esil;
  // ---- NH/PH forfeited: no P/HD on the 2 days before AND the 2 days after (days outside the month count as not present)
  x.forfeited=0;
  for(let i=0;i<n;i++){ if(att[i]!=='NH/PH') continue; let any=false; for(let k=Math.max(0,i-2);k<=Math.min(n-1,i+2);k++) if(worked(att[k])) any=true; if(!any) x.forfeited++; }
  // ---- OFF days NOT paid: (1) sandwich — not present the day before AND after; (2) Sunday OFF 4-day rule
  x.offUnpaid=0;
  const lastDn=n?dn(days[n-1].date):0, lim=Math.min(lastDn, entryUpTo?dn(entryUpTo):0);
  for(let i=0;i<n;i++){
    if(att[i]!=='OFF') continue;
    let un = !( (i>0&&worked(att[i-1])) || (i<n-1&&worked(att[i+1])) );
    if(!un && days[i].dow===0 && S.woMinDays>0){
      let c=0; for(let k=i+1;k<=Math.min(n-1,i+6);k++){ const a=att[k]; if(a==='P'||a==='HD'||a==='NH/PH') c++; }
      const left=lim-dn(days[i].date), span=left>S.woWeekDays?S.woWeekDays:(left<0?0:left);
      const req=Math.ceil(S.woMinDays*span/S.woWeekDays-1e-9);
      if(c<req) un=true;
    }
    if(un) x.offUnpaid++;
  }
  // ---- Comp Off: 1 earned for every FULL Sun–Sat week inside the month with P on all 7 days (Paid Weekly Off = Yes, JUN–DEC)
  x.coEarned=0;
  if((monthStart.getUTCMonth()+1)>=S.compOffFromMonth && e.paidWO==='Yes'){
    for(let i=0;i<n;i++){ if(days[i].dow!==0||i+6>n-1) continue; let all=true; for(let k=i;k<=i+6;k++) if(att[k]!=='P'){ all=false; break; } if(all) x.coEarned++; }
  }
  x.coBalance=Math.max(0,x.coEarned-x.co); x.coHours=x.coBalance*S.compOffHrs;
  // ---- Leave Days = L + LOP + ESI-L ; Unpaid Days = unpaid OFF + forfeited NH/PH ; Total Unpaid Leaves = both
  x.leaveAll=x.leave+x.lop+x.esil; x.unpaidDays=x.offUnpaid+x.forfeited; x.totalUnpaid=x.leaveAll+x.unpaidDays;
  x.nhPaid = e.nhElig==='Yes' ? Math.max(0,x.nhDays-x.forfeited) : 0;
  x.totalPay = Math.min(dim, x.present + (e.paidWO==='Yes' ? Math.max(0,x.off-x.offUnpaid) : 0) + x.nhPaid + x.co);   // CO days are paid days
  return x;
}

function bbCalcReg(e,a,dim,S,monthNo){
  const r={}, monthly=(e.payType==='Monthly');
  r.fixedGross=e.basic+e.hra+e.inc;
  r.fixedNet=r.fixedGross-(e.pf==='Yes'?bbRound(e.basic*S.pf):0)-(e.esi==='Yes'?bbRound((e.basic+e.hra)*S.esi):0);
  r.present=a.present; r.totalPay=a.totalPay; r.sunday=a.sunday; r.leave=a.leaveAll; r.unpaid=a.unpaidDays; r.totalUnpaid=a.totalUnpaid;
  r.coEarned=a.coEarned; r.coUsed=a.co; r.coBalance=a.coBalance; r.coHours=a.coHours;
  r.woDays = e.paidWO==='Yes' ? Math.max(0,a.off-a.offUnpaid) : 0;              // paid weekly-off days (unpaid OFF removed)
  r.otHours=a.otHours; r.nhWorked=a.nhWorked; r.otherDed=e.otherDed;
  const base = monthly ? e.basic/dim : e.basic, baseH = monthly ? e.hra/dim : e.hra;
  const payDays = r.totalPay-(e.wo!==0 ? r.woDays : 0);
  r.earnedBasic=bbRound(base*payDays);
  r.earnedHra=bbRound(baseH*payDays);
  r.incentive=bbRound(e.inc*(String(e.contractor).slice(0,S.incPrefix.length)===S.incPrefix ? r.totalPay : r.present));
  const g=String(e.group).trim();
  r.compRate = (g==='Migrant'||g==='12 HR Migrant')
    ? ((monthly?(e.basic+e.hra)/S.fixedOTDays:e.basic+e.hra)+e.inc)/S.hoursPerDay
    : (monthly ? (e.basic/S.fixedOTDays)/S.hoursPerDay*S.otMultNM : e.basic/S.hoursPerDay*S.otMultNM);   // Comp Off OT: every employee, whether or not OT-eligible
  r.otRate = (g==='12 HR Migrant' || e.otApp==='No') ? 0 : r.compRate;
  r.nhOtHours=a.nhOt; r.forfeited=a.forfeited;
  r.otPay=bbRound(r.otRate*Math.max(0,r.otHours-r.nhOtHours));
  r.sundayPay = bbRound(e.sun*r.sunday);                                          // Sunday work is NOT an "excess day"
  r.woPay = e.wo===0 ? 0 : bbRound(r.woDays*e.wo);
  r.nhOtPay=bbRound(base/S.hoursPerDay*S.nhMult*r.nhOtHours);
  r.nhPay=bbRound(base*S.nhMult*r.nhWorked)+r.nhOtPay;
  r.compOff=bbRound(r.compRate*r.coHours);                                          // Comp Off OT Pay = OT rate x comp-off OT hours
  r.food=a.food; r.attAllow=a.attAllow; r.otherPay=e.otherPay;
  r.gross=r.earnedBasic+r.earnedHra+r.incentive+r.otPay+r.sundayPay+r.woPay+r.nhPay+r.compOff+r.food+r.attAllow+r.otherPay;
  r.pf = e.pf==='Yes' ? bbRound(r.earnedBasic*S.pf) : 0;
  r.esi= e.esi==='Yes' ? bbRound((r.earnedHra+r.earnedBasic)*S.esi) : 0;   // ESI base = Earned Basic + Earned HRA only (no OT)
  r.asset=e.asset;
  r.totalDed=r.pf+r.esi+r.otherDed+r.asset;
  r.net=r.gross-r.totalDed;
  const fmt=v=>Math.round(v).toLocaleString('en-US');
  r.remarks=((r.present+r.woDays===0?'NO ATTENDANCE. ':'')+(r.forfeited>0?'NH/PH forfeited ('+r.forfeited+' day). ':'')+
             (r.coBalance>0&&r.compOff>0?'Excess days worked: '+r.coBalance+' comp-off day(s) not taken, paid as Comp Off OT ('+r.coHours+' hrs = Rs '+fmt(r.compOff)+'). ':'')+
             (g==='12 HR Migrant'&&r.present>0?'OT not payable (12 hr migrant). ':'')).trim();
  return r;
}

function bbVanKind(tag,T){
  const t=String(tag||'').trim(); if(!t||/^(no van|none)$/i.test(t)) return '';
  if(T && T.mdName && t===String(T.mdName).trim()) return 'MD';
  if(T && T.dName && t===String(T.dName).trim()) return 'D';
  if(/per\s*man[\s-]*day/i.test(t)) return 'MD';
  if(/per\s*day/i.test(t)) return 'D';
  return 'X';
}

const bbVanLbl=k=>k==='MD'?'Per Man-Day':(k==='D'?'Per Day':'No Van');

const bbVanCls=e=>e&&e.vanKind!==undefined?(' van-'+(e.vanKind==='MD'?'md':(e.vanKind==='D'?'d':'nv'))):'';

function bbCalcInvoice(M){
  const R=M.emps.map(e=>e.reg), sum=k=>R.reduce((t,r)=>t+(r[k]||0),0), T=M.terms||{}, I={};
  I.manDays=sum('totalPay'); I.sumBasic=sum('earnedBasic'); I.sumHra=sum('earnedHra'); I.sumInc=sum('incentive');
  I.sumOtHours=sum('otHours'); I.sumOtPay=sum('otPay'); I.sumSun=sum('sundayPay'); I.sumWo=sum('woPay'); I.sumNh=sum('nhPay');
  I.sumComp=sum('compOff'); I.sumAllow=sum('food')+sum('attAllow'); I.sumOther=sum('otherPay');
  const paid=M.emps.filter(e=>e.reg.totalPay>0);
  I.male=paid.filter(e=>e.gender==='Male').length; I.female=paid.filter(e=>e.gender==='Female').length; I.heads=paid.length;
  I.van=paid.filter(e=>bbVanKind(e.van,T)!=='').length; I.noVan=I.heads-I.van;
  I.gross=I.sumBasic+I.sumHra+I.sumInc+I.sumOtPay+I.sumSun+I.sumWo+I.sumNh+I.sumComp+I.sumAllow;
  I.wageTotal=I.gross+I.sumOther;
  const perMD=T.scMode==='₹ Per Man-Day';
  I.svc= num(T.scRate)? bbRound(perMD? I.manDays*num(T.scRate) : I.gross*num(T.scRate)) : 0;
  I.epf= num(T.epfRate)? bbRound(I.sumBasic*num(T.epfRate)) : 0;
  I.esic=num(T.esicRate)? bbRound(I.gross*num(T.esicRate)) : 0;
  // ---- VAN: counted on PRESENT days of the tagged employees
  const tagged=k=>M.emps.filter(e=>bbVanKind(e.van,T)===k);
  I.mdPresent=tagged('MD').reduce((t,e)=>t+e.reg.present,0);  I.mdHeads=tagged('MD').filter(e=>e.reg.present>0).length;
  I.dPresent =tagged('D').reduce((t,e)=>t+e.reg.present,0);   I.dHeads =tagged('D').filter(e=>e.reg.present>0).length;
  I.mdVan = num(T.mdRate)? bbRound(num(T.mdRate)*I.mdPresent) : 0;                         // Per Man-Day Van = rate x present days of tagged heads
  I.dayVan= num(T.dRate)? bbRound(num(T.dRate)*num(T.dDays)) : 0;                          // Per Day Van    = rate per day x days entered
  I.dayVanCheck = num(T.mdRate)? bbRound(num(T.mdRate)*I.dPresent) : 0;                    // same heads costed per man-day (reasonableness check)
  I.dayVanDiff = I.dayVan-I.dayVanCheck;
  I.dayVanPct  = I.dayVanCheck? I.dayVan/I.dayVanCheck : null;
  I.vanTotal=I.mdVan+I.dayVan;
  I.subtotal=I.wageTotal+I.svc+I.epf+I.esic+I.vanTotal;
  I.igst=num(T.igstRate)? bbRound(I.subtotal*num(T.igstRate)) : 0;
  I.other=num(M.other)||0;                       // manual 'Other' line (Mini Payroll only); 0 everywhere else
  I.grand=I.subtotal+I.igst+I.other;
  I.invNo='INV-'+String(M.con).replace(/\s/g,'').slice(0,3).toUpperCase()+'-'+String(M.mi+1).padStart(2,'0')+String(M.year).slice(2);
  return I;
}

function bbTimeFrac(v){            // an In/Out cell from CP Payroll (a time) -> Excel time fraction
  if(v instanceof Date) return (v.getHours()*60+v.getMinutes()+v.getSeconds()/60)/1440;
  if(typeof v==='number' && v>0 && v<1) return v;
  return null;
}

function attLayout(o){
  const S=o.sel||null, has=id=>!S||S.has(id), io=!!o.hasInOut, cmp=!!o.compress;
  const stat=[['S.No','S.No',''],['Employee ID','Employee ID','l'],['Employee Name','Employee Name','l'],['Gender','Gender','l'],['Contractor','Contractor','l'],['UAN Number','UAN Number',''],['ESI Number','ESI Number',''],['Van Type','Van','']].filter(x=>has(x[0]));
  const sum=ATT_SUMCOLS.filter(k=>has(ATT_SUMIDS[k[1]]));
  const sub=['In','Out','Att','OT'].filter(x=>has(x)&&((x!=='In'&&x!=='Out')||(io&&!cmp)));      // compress hides In / Out
  const rowsPer=cmp?[has('Att')?'Att':null,has('OT')?'OT':null].filter(Boolean):[];
  return {stat:stat,sum:sum,sub:sub,rowsPer:rowsPer,io:io,cmp:cmp};
}

const BB_TIME=v=>{ if(v===''||v===null||v===undefined) return ''; let m=null;
  if(v instanceof Date) m=v.getHours()*60+v.getMinutes(); else if(typeof v==='number'&&v>0&&v<1) m=Math.round(v*1440); else return '';
  return String(Math.floor(m/60)%24).padStart(2,'0')+':'+String(m%60).padStart(2,'0'); };

function bbDefaultSel(M,all){
  const att=new Set(), reg=new Set();
  BB_ATT_STATIC.forEach(c=>{ if(c.o&&!all) return; if(all||c.id!=='Contractor') att.add(c.id); });
  ['Att','OT'].forEach(x=>att.add(x)); if(all&&M&&M.hasInOut){ att.add('In'); att.add('Out'); }

  BB_REG_COLS.forEach(c=>{ if(c.x||c.o){ if(all) reg.add(c.id); } else if(all||c.id!=='Contractor') reg.add(c.id); });
  return {att:att,reg:reg};
}

function invHtml(i,emps,monthLabel,dim){

 ${row('SUBTOTAL BEFORE TAX','Before Tax',i.subtotal,1)}${row('IGST / CGST',pct(i.gst_rate),i.gst)}${row('GRAND TOTAL','Payable Amount',i.grand_total,1)}</table>

VIEWS.slip=async()=>{await reportShell('Salary slip');$('#rx').remove();let rows=[];
 const lab=()=>new Date(CUR_MONTH).toLocaleDateString('en-GB',{month:'long',year:'numeric'});
 $('#rb').innerHTML='<div class="mut">Choose month and contractor, press Show, then tick the employees to print.</div>';
 const show=async()=>{const m=pickedMonth(),c=$('#rcn').value;const r=await call(P('register_get',{p_month:m,p_contractor:c?Number(c):null}));rows=r.rows.map(x=>Object.assign({status:r.status},x));
  const cl=await call(P('contractors_list'));const cn=Object.fromEntries(cl.map(z=>[z.id,z.name]));window._cn=cn;
  $('#rb').innerHTML=`<div class="row noprint bulk"><label>Search<input id="sq" placeholder="ID or name"></label><button class="b" id="sp">${bt('print','Print ticked slips')}</button><button class="b l" id="sall">Tick all shown</button><span class="mut" id="sc">${rows.length} employees</span></div><div class="scroll"><table><tr><th></th><th>ID</th><th>Name</th><th>Contractor</th><th>Gross</th><th>Net</th><th>View</th></tr><tbody id="sbd"></tbody></table></div>`;
  const draw=()=>{const q=$('#sq').value.toLowerCase();$('#sbd').innerHTML=rows.filter(x=>!q||x.emp_id.toLowerCase().includes(q)||x.name.toLowerCase().includes(q)).map(x=>`<tr data-e="${x.emp_id}"><td><input type="checkbox" class="sk"></td><td>${x.emp_id}</td><td>${esc(x.name)}</td><td>${esc(cn[x.contractor_id]||'')}</td><td>${money(x.gross)}</td><td>${money(x.net)}</td><td>${ib('eye','Preview slip',`data-sv="${x.emp_id}"`)}</td></tr>`).join('');
   document.querySelectorAll('[data-sv]').forEach(b=>b.onclick=()=>build([b.dataset.sv],true))};
  draw();$('#sq').oninput=draw;$('#sall').onclick=()=>document.querySelectorAll('.sk').forEach(k=>k.checked=true);
  const build=async(ids,preview)=>{const out=[];for(const id of ids){const x=rows.find(z=>z.emp_id===id);const e=(await call(P('employee_get',{p_emp:id}))).employee;out.push(slipHtml(x,e,cn[x.contractor_id]||'',lab()))}
   if(preview){const m=modal(`<style>${SLIPCSS}.doc{page-break-after:auto}</style>${out[0]}<div class="row" style="margin-top:10px"><button class="b g" id="pp">${bt('print','Print / Save as PDF')}</button><button class="b l" id="pc" style="color:#0b2a5e;border-color:#0b2a5e">${bt('x','Close')}</button></div>`);m.querySelector('#pc').onclick=()=>m.remove();m.querySelector('#pp').onclick=()=>slipPrint(out)}else slipPrint(out)};
  $('#sp').onclick=()=>{const ids=[...document.querySelectorAll('.sk:checked')].map(k=>k.closest('tr').dataset.e);if(!ids.length)return toast('Tick employees first',true);if(ids.length>60&&!confirm('Print '+ids.length+' slips? This may take a minute.'))return;build(ids,false)}};
 $('#rg').onclick=show;show()};
function slipPrint(list){const w=window.open('','_blank');if(!w)return toast('Please allow pop-ups to print',true);w.document.write(`<html><head><title>Salary slips</title><style>@page{size:A4;margin:8mm}${SLIPCSS}</style></head><body>${list.join('')}</body></html>`);w.document.close();w.focus();setTimeout(()=>w.print(),500)}

let HYEAR=new Date().getFullYear();
VIEWS.holidays=async()=>{const d=await call(P('holidays_list',{p_year:HYEAR}));const ed=can('rates_edit');
 const yrs=[];for(let y=new Date().getFullYear()-2;y<=new Date().getFullYear()+2;y++)yrs.push(y);
 const wd=s=>['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][new Date(s+'T00:00:00').getDay()];
 $('#main').innerHTML=`<div class="card"><h2>Holidays</h2><div class="row noprint"><label>Year<select id="hy">${yrs.map(y=>`<option ${y===HYEAR?'selected':''}>${y}</option>`).join('')}</select></label>
 ${ed?`<button class="b g" id="ha">${bt('plus','Add holiday')}</button><button class="b l" id="hc">${bt('dl','Copy from previous year')}</button>`:''}<span class="mut">${d.length} holiday(s) in ${HYEAR}. Only “Applicable” holidays are paid as NH/PH. The festival dates change every year, so review the list each January.</span></div>
 <div class="scroll" style="margin-top:10px"><table><tr><th>Date</th><th>Day</th><th>Name</th><th>Kind</th><th>Applicable</th>${ed?'<th>Actions</th>':''}</tr>
 ${d.map(h=>`<tr data-d="${h.holiday_date}"><td>${h.holiday_date}</td><td>${wd(h.holiday_date)}</td><td>${esc(h.name)}</td><td>${h.kind}</td><td><span class="tag ${h.applicable?'ok':'warn'}">${h.applicable?'Yes':'No'}</span></td>${ed?`<td>${ib('edit','Edit',`data-he="${h.holiday_date}"`)}${ib('trash','Delete',`data-hx="${h.holiday_date}"`,'d')}</td>`:''}</tr>`).join('')||`<tr><td colspan="6">No holidays entered for ${HYEAR}. Use “Add holiday” or “Copy from previous year”.</td></tr>`}</table></div></div>`;
 $('#hy').onchange=e=>{HYEAR=Number(e.target.value);VIEWS.holidays()};
 const form=(h)=>{const m=modal(`<h2>${h?'Edit':'Add'} holiday</h2><div class="fg"><label>Date<input type="date" id="f_d" value="${h?h.holiday_date:''}"></label><label>Name<input id="f_n" value="${esc(h?h.name:'')}"></label>
  <label>Kind<select id="f_k"><option ${h&&h.kind==='National'?'selected':''}>National</option><option ${h&&h.kind==='Festival'?'selected':''}>Festival</option></select></label>
  <label>Applicable (paid as NH/PH)<select id="f_a"><option value="true" ${!h||h.applicable?'selected':''}>Yes</option><option value="false" ${h&&!h.applicable?'selected':''}>No</option></select></label></div>
  <div class="row" style="margin-top:12px"><button class="b g" id="f_ok">${bt('save','Save')}</button><button class="b l" id="f_x" style="color:#0b2a5e;border-color:#0b2a5e">${bt('x','Cancel')}</button></div>`);
  m.querySelector('#f_x').onclick=()=>m.remove();
  m.querySelector('#f_ok').onclick=async()=>{const dt=m.querySelector('#f_d').value,nm=m.querySelector('#f_n').value.trim();if(!dt||!nm)return toast('Date and name are required',true);
   if(h&&h.holiday_date!==dt)await call(P('holiday_delete',{p_date:h.holiday_date}));
   await call(P('holiday_save',{p_date:dt,p_name:nm,p_kind:m.querySelector('#f_k').value,p_applicable:m.querySelector('#f_a').value==='true'}),'Saved');m.remove();HYEAR=Number(dt.slice(0,4));VIEWS.holidays()}};
 if($('#ha'))$('#ha').onclick=()=>form(null);
 document.querySelectorAll('[data-he]').forEach(b=>b.onclick=()=>form(d.find(x=>x.holiday_date===b.dataset.he)));
 document.querySelectorAll('[data-hx]').forEach(b=>b.onclick=async()=>{const h=d.find(x=>x.holiday_date===b.dataset.hx);if(!confirm('Delete '+h.name+' ('+h.holiday_date+')? Months containing this date will be recalculated.'))return;await call(P('holiday_delete',{p_date:h.holiday_date}),'Deleted');VIEWS.holidays()});
 if($('#hc'))$('#hc').onclick=async()=>{const prev=await call(P('holidays_list',{p_year:HYEAR-1}));if(!prev.length)return toast('No holidays in '+(HYEAR-1),true);
  const have=new Set(d.map(x=>x.holiday_date));const todo=prev.map(x=>({...x,nd:(HYEAR)+x.holiday_date.slice(4)})).filter(x=>!have.has(x.nd)&&!(x.nd.slice(5)==='02-29'));
  if(!todo.length)return toast('Everything is already copied');if(!confirm('Copy '+todo.length+' holiday(s) from '+(HYEAR-1)+' to the same dates in '+HYEAR+'?\n\nFestival dates move every year, so edit them afterwards.'))return;
  for(const x of todo)await call(P('holiday_save',{p_date:x.nd,p_name:x.name,p_kind:x.kind,p_applicable:x.applicable}));toast(todo.length+' copied. Please correct the festival dates.');VIEWS.holidays()}};

 $('#main').innerHTML=`<div class="card"><h2>Shift settings</h2><div class="row noprint">${ed?`<button class="b g" id="sa">${bt('plus','Add shift')}</button>`:''}<span class="mut">Attendance picks the shift nearest to the In time (a tie goes to the later shift); staffed hours decide the half-day and OT limits. Changes apply to months calculated afterwards.</span></div>

 ${s.map(x=>`<tr style="${x.active?'':'opacity:.55'}"><td>${esc(x.code)}</td><td>${hm(x.start_time)}</td><td>${hm(x.end_time)}</td><td>${x.hours}</td><td>${x.night?'Yes':'No'}</td><td><span class="tag ${x.active?'ok':'warn'}">${x.active?'Active':'Inactive'}</span></td>${ed?`<td>${ib('edit','Edit',`data-se="${esc(x.code)}"`)}</td>`:''}</tr>`).join('')}</table></div></div>

 const form=(x)=>{const m=modal(`<h2>${x?'Edit':'Add'} shift</h2><div class="fg"><label>Shift name<input id="s_c" value="${esc(x?x.code:'')}" ${x?'readonly':''}></label><label>Start<input type="time" id="s_s" value="${x?hm(x.start_time):'09:00'}"></label><label>End<input type="time" id="s_e" value="${x?hm(x.end_time):'17:30'}"></label>
  <label>Staffed hours<input type="number" step="0.25" id="s_h" value="${x?x.hours:8}"></label><label>Night shift<select id="s_n"><option value="false" ${x&&x.night?'':'selected'}>No</option><option value="true" ${x&&x.night?'selected':''}>Yes</option></select></label><label>Status<select id="s_a"><option value="true" ${!x||x.active?'selected':''}>Active</option><option value="false" ${x&&!x.active?'selected':''}>Inactive</option></select></label></div>
  <div class="row" style="margin-top:12px"><button class="b g" id="s_ok">${bt('save','Save')}</button><button class="b l" id="s_x" style="color:#0b2a5e;border-color:#0b2a5e">${bt('x','Cancel')}</button></div>`);
  m.querySelector('#s_x').onclick=()=>m.remove();
  m.querySelector('#s_ok').onclick=async()=>{const g=i=>m.querySelector('#'+i).value;if(!g('s_c').trim())return toast('Shift name is required',true);
   await call(P('shift_save',{p_code:g('s_c'),p_start:g('s_s'),p_end:g('s_e'),p_hours:Number(g('s_h')),p_night:g('s_n')==='true',p_active:g('s_a')==='true'}),'Saved');m.remove();VIEWS.shifts()}};
 if($('#sa'))$('#sa').onclick=()=>form(null);document.querySelectorAll('[data-se]').forEach(b=>b.onclick=()=>form(s.find(z=>z.code===b.dataset.se)))};

/* ===== rule book ===== */
let RBQ='';
VIEWS.rulebook=async()=>{const live=await call(C('rulebook'));
 const secs=[];let cur=null;RB.forEach(r=>{if(r.length===1&&/^([A-Z]|\d+)\.\s/.test(r[0])){cur={t:r[0],rows:[]};secs.push(cur)}else if(cur)cur.rows.push(r)});
 const lbl={rejoin_gap_months:'Rejoin gap (months)',migrant_12hr_staff_minutes:'12 HR Migrant OT after (minutes)',esi_includes_ot:'ESI includes OT',pf_employee_rate:'Employee PF rate',esi_employee_rate:'Employee ESI rate',pf_employer_rate_default:'Employer PF rate',esi_employer_rate_default:'Employer ESIC rate',gst_rate_default:'GST rate',day_hours:'Hours in a day',ot_multiplier_non_migrant:'Non Migrant OT multiplier',holiday_premium_basic_x:'NH/PH worked premium (x Basic)',holiday_ot_multiplier:'NH/PH worked OT multiplier',food_allowance_per_day:'Food allowance per day (₹)',att_allowance_full_month:'Attendance allowance, full month (₹)',att_allowance_all_working_days:'Attendance allowance, all working days (₹)',p_limit_minutes_non_migrant:'Non Migrant: Present from (minutes)',hd_limit_minutes_non_migrant:'Non Migrant: Half day from (minutes)',p_limit_minutes_migrant:'Migrant: Present from (minutes)',hd_limit_minutes_migrant:'Migrant: Half day from (minutes)',absent_review_days:'Absent review after (days)',headcount_lock_pct:'Headcount lock share'};
 const fv=v=>typeof v==='boolean'?(v?'Yes':'No'):String(v);
 $('#main').innerHTML=`<div class="card noprint"><h2>Rule Book &amp; Policy</h2><div class="row"><label style="flex:1;min-width:260px">Search the rules<input id="rq" placeholder="Type a word, e.g. OT, Sunday, holiday, food, PF, rejoin" value="${esc(RBQ)}"></label><label>Go to section<select id="rs"><option value="">All sections</option>${secs.map((s,i)=>`<option value="${i}">${esc(s.t)}</option>`).join('')}<option value="live">Current settings (live values)</option></select></label></div><div class="mut" id="rc"></div></div><div id="rbody"></div>`;
 const hl=(t,q)=>{t=esc(t);if(!q)return t;const re=new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig');return t.replace(re,'<mark>$1</mark>')};
 const draw=()=>{const q=$('#rq').value.trim(),sel=$('#rs').value;RBQ=q;const ql=q.toLowerCase();let n=0,h='';
  if(sel!=='live'){secs.forEach((s,i)=>{if(sel!==''&&String(i)!==sel)return;const rows=s.rows.filter(r=>!ql||r.join(' ').toLowerCase().includes(ql));if(!rows.length&&!(ql&&s.t.toLowerCase().includes(ql)))return;n+=rows.length;
   h+=`<div class="card"><h2>${hl(s.t,q)}</h2><div class="scroll"><table class="rbt">${rows.map((r,j)=>{const star=/^★/.test(r[0]);return `<tr${star?' style="background:rgba(246,221,138,.35)"':''}>${r.map((c,k)=>k===0?`<td><b>${hl(c,q)}</b></td>`:`<td>${hl(c,q)}</td>`).join('')}</tr>`}).join('')}</table></div></div>`})}
  if(sel===''||sel==='live'){const L=live.filter(x=>!ql||(x.key+' '+(x.note||'')+' '+(lbl[x.key]||'')).toLowerCase().includes(ql)||'current settings live values'.includes(ql));if(L.length){n+=L.length;
   h+=`<div class="card"><h2>Current settings (live values in force today)</h2><div class="mut">These are the values the system is calculating with right now. Only an Administrator can change them.</div><div class="scroll"><table><tr><th>Setting</th><th>Value</th><th>Since</th><th>Meaning</th></tr>${L.map(x=>`<tr><td><b>${hl(lbl[x.key]||x.key.replace(/_/g,' '),q)}</b></td><td>${hl(fv(x.value),q)}</td><td>${(x.effective_from||'').startsWith('2000')?'Always':x.effective_from}</td><td>${hl(x.note||'',q)}</td></tr>`).join('')}</table></div></div>`}}
  $('#rbody').innerHTML=h||'<div class="card">No rule matches that word.</div>';$('#rc').textContent=q?n+' matching line(s)':''};
 draw();$('#rq').oninput=draw;$('#rs').onchange=draw};

(function(){const fix=n=>{n.querySelectorAll&&n.querySelectorAll('th,h2,h3,h4,label,.sect,small,legend').forEach(e=>{const t=[...e.childNodes].find(x=>x.nodeType===3&&x.nodeValue.trim());if(t){const v=t.nodeValue,i=v.search(/\S/);if(/[a-z]/.test(v[i])){t.nodeValue=v.slice(0,i)+v[i].toUpperCase()+v.slice(i+1)}}})};
 new MutationObserver(ms=>{ms.forEach(m=>m.addedNodes.forEach(n=>{if(n.nodeType===1)fix(n)}))}).observe(document.documentElement,{childList:true,subtree:true});fix(document)})();
