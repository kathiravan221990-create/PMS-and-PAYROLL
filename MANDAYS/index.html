<style>
:root{--bg:#07173a;--bg2:#0b2250;--panel:#0f2d63;--panel2:#143a78;--gold:#d9b341;--gold2:#f0cf6a;--cell:#fff5c9;--ink:#000;--lt:#e8eefc;--line:#c9b25a;--mut:#aebce0;--A:#4f8cff;--B:#ff9a3c}
*{box-sizing:border-box}body{margin:0;font:14px/1.45 "Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--lt)}
header{display:flex;align-items:center;gap:14px;padding:12px 20px;background:linear-gradient(180deg,#051231,#0a1f4a);border-bottom:2px solid var(--gold);flex-wrap:wrap}
header img{width:44px;height:44px;border-radius:50%}header b{color:var(--gold);letter-spacing:2px;font-size:18px;display:block}header span.s{font-size:11px;color:var(--mut)}
header .sp{flex:1}.tg2{display:flex;border:1px solid var(--gold);border-radius:9px;overflow:hidden}.tg2 button{background:transparent;color:var(--lt);border:0;padding:7px 16px;font-weight:700;cursor:pointer;letter-spacing:1px}.tg2 button.on{background:var(--gold);color:#000}.who{font-size:12px;color:var(--mut)}
a.back,button.b{background:var(--gold);color:#000;border:0;border-radius:8px;padding:7px 14px;font-weight:700;cursor:pointer;font-size:13px;text-decoration:none}
button.l{background:#1b3f7e;color:var(--lt)}
nav.tabs{display:flex;gap:6px;padding:12px 20px 0;flex-wrap:wrap}
nav.tabs button{background:var(--panel);color:var(--lt);border:1px solid #2a4a86;border-bottom:0;border-radius:10px 10px 0 0;padding:9px 18px;font-weight:600;cursor:pointer;font-size:14px}
nav.tabs button.on{background:var(--gold);color:#000;font-weight:800}
main{padding:16px 20px 40px}.bar{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;margin-bottom:12px}
label.f{font-size:12px;color:var(--mut);display:flex;flex-direction:column;gap:3px}
select,input{background:#fff;color:#000;border:1px solid var(--line);border-radius:7px;padding:6px 9px;font:inherit}
input.pl{width:110px;text-align:right}
.card{background:var(--panel);border:1px solid #2a4a86;border-radius:12px;padding:12px;overflow:auto}
table{border-collapse:collapse;width:100%}th{background:var(--panel2);color:var(--gold2);font-size:12px;letter-spacing:.5px;text-transform:uppercase;padding:8px 10px;text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}td{padding:7px 10px;border-top:1px solid #234a8a;text-align:right;white-space:nowrap}

async function loadFY(fy){const k=fy+'|'+mode;if(!D[k]){D[k]=(await API('mandays_month_summary',{p_fy:fy,p_mode:mode}))||[];try{D[k+'|s']=(await API('mandays_split_summary',{p_fy:fy,p_mode:mode}))||[]}catch(e){D[k+'|s']=[]}}return D[k]}
function agg(fy,idx){const rows=D[fy+'|'+mode]||[],keys=idx.map(i=>mkey(fy,i));const by={},per=idx.map(()=>0);let tot=0,plan=false,any=false,split=false,lo=false;
  rows.forEach(r=>{const k=String(r.month).slice(0,10),p=keys.indexOf(k);if(p<0)return;const v=+r.mandays;any=true;tot+=v;per[p]+=v;
    if(mode==='ultra'&&r.source==='history')lo=true;

    // table 2 first (month by month)
    title(t2-1,'TABLE 2 · MONTH BY MONTH');header(t2,'Month');
    const mrows=[];let sA=0,sB=0,anyA=false,anyB=false;
    for(let i=0;i<n;i++){const r=m0+i,a=mo(A0.fy,A0.idx,i),b=mo(B0.fy,B0.idx,i);
      const la=A0.idx[i]!=null?MN[A0.idx[i]]:'—',lb=B0.idx[i]!=null?MN[B0.idx[i]]:'—';
      const av=a&&a.any?a.tot:(a?'Planned':'—'),bv=b&&b.any?b.tot:(b?'Planned':'—');
      if(isN(av)){sA+=av;anyA=true}if(isN(bv)){sB+=bv;anyB=true}
      put(r,la===lb?la:la+' vs '+lb,av,bv,'row');
      [2,3].forEach(c=>{const v=ws.getCell(r,c).value;if(typeof v==='string'){ws.getCell(r,c).font=fnt({italic:true,color:{argb:'FF8A5200'}})}});mrows.push(r)}
    const last=m0+n-1;
    // table 1
    title(t1-2,'TABLE 1 · TOTAL MANDAYS');header(t1-1,'Particulars');
    put(t1,'Total mandays',anyA?{f:`SUM(B${m0}:B${last})`,v:sA}:'—',anyB?{f:`SUM(C${m0}:C${last})`,v:sB}:'—','tot');
    LNc.forEach((L,k)=>{const va=A.split?(L.s?(((A.by2||{})[L.p]||{})[L.n]||0):(A.by[L.p]||0)):'—',vb=B.split?(L.s?(((B.by2||{})[L.p]||{})[L.n]||0):(B.by[L.p]||0)):'—';put(t1+1+k,L.n,va,vb,L.s?'sub2':'sub')});
    wb.calcProperties={fullCalcOnLoad:true};
    const buf=await wb.xlsx.writeBuffer(),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));
    const san=s=>s.replace(/[^A-Za-z0-9-]+/g,'_');a.download=`MANDAYS_Compare_${san(A0.t)}_vs_${san(B0.t)}_${mode.toUpperCase()}_${expanded?'Expanded':'Collapsed'}.xlsx`;
    document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);toast('Excel downloaded')
  }catch(e){toast(emsg(e))}}

function periodDefs(kind){return kind==='month'?MN.map((n,i)=>({k:'m'+i,label:n,idx:[i]})):[0,1,2,3].map(q=>({k:'q'+q,label:'Q'+(q+1)+' ('+MN[q*3]+'–'+MN[q*3+2]+')',idx:[q*3,q*3+1,q*3+2]}))}
async function vPeriods(kind){
  paint('<div class="card">Loading…</div>');
  await loadFY(selFY);await loadFY(selFY-1);
  const defs=periodDefs(kind);let tA=0,tB=0,anyA=false,anyB=false,body='';
  const fyOpts=[];for(let y=2025;y<=curFY+1;y++)fyOpts.push(y);
  defs.forEach(d=>{const A=agg(selFY,d.idx);const got=d.idx.filter(i=>agg(selFY,[i]).any),partQ=kind==='quarter'&&got.length>0&&got.length<d.idx.length;const B=agg(selFY-1,partQ?got:d.idx);const PT=partQ?` <span class="pill" title="Last year is compared for the same months only">Part: ${got.map(i=>MN[i]).join(', ')} only</span>`:'';if(A.any){tA+=A.tot;anyA=true;if(B.any){tB+=B.tot;anyB=true}}
    const open=openSet.has(kind+d.k),canX=A.split||B.split;let aCell;
    if(!A.any&&kind==='month')aCell=`<span class="pill">Planned</span> <input class="pl" data-m="${mkey(selFY,d.idx[0])}" placeholder="mandays"> <button class="b l" data-save="${mkey(selFY,d.idx[0])}">Save</button>`;
    else aCell=fmt(A.tot)+(A.plan?' <span class="pill">Planned</span>':'');
    const planRow=A.plan&&kind==='month'?` <button class="b l" data-clr="${mkey(selFY,d.idx[0])}">Clear</button>`:'';
    body+=`<tr class="${canX?'par':''}" data-k="${kind+d.k}"><td><span class="tg">${canX?(open?'▾':'▸'):''}</span>${esc(d.label)}${PT}</td><td>${aCell}${A.lo?LOP:''}${planRow}</td><td>${fmt(B.tot)}${B.lo?LOP:''}${PT?'':''}</td>${diffCells(A.tot,B.tot)}</tr>`;
    if(open&&canX){[...new Set([...Object.keys(A.by),...Object.keys(B.by)])].sort().forEach(c=>{const a=A.by[c]||0,b=B.split?(B.by[c]||0):null;body+=conRows(kind+d.k,c,a,b,A,B)})}});
  paint(`<div class="bar"><label class="f">Financial year<select id="fy">${fyOpts.map(y=>`<option value="${y}" ${y===selFY?'selected':''}>${fyl(y)}</option>`).join('')}</select></label><span class="mut">Compared with ${fyl(selFY-1)}</span></div>
  <div class="card"><table><tr><th>${kind==='month'?'Month':'Quarter'}</th><th>FY ${fyl(selFY)}</th><th>FY ${fyl(selFY-1)}</th><th>Difference</th><th>%</th></tr>${body}
  <tr class="tot"><td>Total (months with data in both years)</td><td>${fmt(anyA?tA:null)}</td><td>${fmt(anyB?tB:null)}</td>${diffCells(anyA?tA:null,anyB?tB:null)}</tr></table>
  <div class="note">Click a row to see contractors. Up to Oct 2026 from the Excel history; from Nov 2026 live from Payroll. Months with no data are Planned: enter expected mandays, replaced by real Payroll data once it arrives. FY 2025-26 has monthly totals only (no contractor split).${mode==='ultra'?LONOTE:''}</div></div>`);
  $('#fy').onchange=e=>{selFY=+e.target.value;vPeriods(kind)};
  document.querySelectorAll('tr.par').forEach(r=>r.onclick=()=>{const k=r.dataset.k;openSet.has(k)?openSet.delete(k):openSet.add(k);vPeriods(kind)});wire2(()=>vPeriods(kind));
  document.querySelectorAll('[data-save]').forEach(b=>b.onclick=async()=>{const m=b.dataset.save,v=parseFloat(document.querySelector('input[data-m="'+m+'"]').value);if(!(v>=0))return toast('Enter a number');
    try{await API('mandays_plan_save',{p_month:m,p_mandays:v});for(const k in D)delete D[k];toast('Planned figure saved');vPeriods(kind)}catch(e){toast(emsg(e))}});
  document.querySelectorAll('[data-clr]').forEach(b=>b.onclick=async()=>{try{await API('mandays_plan_clear',{p_month:b.dataset.clr});for(const k in D)delete D[k];toast('Planned figure cleared');vPeriods(kind)}catch(e){toast(emsg(e))}})}

function cmpOptions(kind){const o=[];for(let y=2025;y<=curFY+1;y++){
  if(kind==='quarter')[0,1,2,3].forEach(q=>o.push({v:y+'|'+q,t:'Q'+(q+1)+' '+fyl(y),fy:y,idx:[q*3,q*3+1,q*3+2]}));
  else if(kind==='half')[0,1].forEach(h=>o.push({v:y+'|'+h,t:'H'+(h+1)+' '+fyl(y),fy:y,idx:[0,1,2,3,4,5].map(i=>i+h*6)}));
  else if(kind==='month')MN.forEach((n,i)=>o.push({v:y+'|'+i,t:n+' '+fyl(y),fy:y,idx:[i]}));
  else if(kind==='fy')o.push({v:y+'|0',t:'FY '+fyl(y)+' (full year, Apr–Mar)',fy:y,idx:[...Array(12).keys()]});
  else{const n=Math.min(12,Math.max(1,(now.getFullYear()-curFY)*12+now.getMonth()-3+1));o.push({v:y+'|0',t:'FY '+fyl(y)+' · Apr–'+MN[n-1]+' (year to date)',fy:y,idx:[...Array(n).keys()]})}}return o}
async function vCmp(){
  const opts=cmpOptions(cmp.kind);
  if(!opts.find(o=>o.v===cmp.a)||!opts.find(o=>o.v===cmp.b)){
    const yrs=curFY+1-2025+1,per=opts.length/yrs,cp=(now.getMonth()+9)%12;
    const cpi=cmp.kind==='quarter'?Math.floor(cp/3):cmp.kind==='half'?Math.floor(cp/6):cmp.kind==='month'?cp:0;
    const ci=(curFY-2025)*per+cpi;cmp.b=opts[ci].v;cmp.a=opts[Math.max(0,ci-per)].v}
  const A0=opts.find(o=>o.v===cmp.a),B0=opts.find(o=>o.v===cmp.b);
  paint('<div class="card">Loading…</div>');await loadFY(A0.fy);await loadFY(B0.fy);
  const A=agg(A0.fy,A0.idx),B=agg(B0.fy,B0.idx);
  const cons=[...new Set([...Object.keys(A.by),...Object.keys(B.by)])].sort(),open=openSet.has('cmp');
  const cnt=(fy,ix)=>ix.filter(i=>(D[fy+'|'+mode]||[]).some(r=>String(r.month).slice(0,10)===mkey(fy,i))).length,nA=cnt(A0.fy,A0.idx),nB=cnt(B0.fy,B0.idx),partial=(nA<A0.idx.length||nB<B0.idx.length);
  let body=`<tr class="par" data-k="cmp"><td><span class="tg">${cons.length?(open?'▾':'▸'):''}</span>Total mandays</td><td>${fmt(A.tot)}${A.plan?' <span class="pill">Planned</span>':''}${A.lo?LOP:''}</td><td>${fmt(B.tot)}${B.plan?' <span class="pill">Planned</span>':''}${B.lo?LOP:''}</td>${diffCells(A.tot,B.tot)}</tr>`;
  if(open)cons.forEach(c=>{const a=A.split?(A.by[c]||0):null,b=B.split?(B.by[c]||0):null;body+=conRows('cmp',c,a,b,A,B)});
  const n=Math.max(A0.idx.length,B0.idx.length),mx=Math.max(1,...A.per,...B.per),W=Math.max(520,n*(n>6?70:110)),H=240,pad=30,bw=Math.min(34,(W-60)/n/2.6);let bars='';
  for(let i=0;i<n;i++){const x=50+i*((W-60)/n),ha=(A.per[i]||0)/mx*(H-pad-20),hb=(B.per[i]||0)/mx*(H-pad-20),la=A0.idx[i]!=null?MN[A0.idx[i]]:'';
    bars+=`<rect x="${x}" y="${H-pad-ha}" width="${bw}" height="${ha}" fill="var(--A)" rx="3"/><text x="${x+bw/2}" y="${H-pad-ha-4}" fill="#e8eefc" font-size="10" text-anchor="middle">${A.per[i]?fmt(A.per[i]):''}</text><rect x="${x+bw+4}" y="${H-pad-hb}" width="${bw}" height="${hb}" fill="var(--B)" rx="3"/><text x="${x+bw*1.5+4}" y="${H-pad-hb-4}" fill="#e8eefc" font-size="10" text-anchor="middle">${B.per[i]?fmt(B.per[i]):''}</text><text x="${x+bw+2}" y="${H-10}" fill="#aebce0" font-size="11" text-anchor="middle">${la}</text>`}
  const sel=(id,v)=>`<select id="${id}">${opts.map(o=>`<option value="${o.v}" ${o.v===v?'selected':''}>${esc(o.t)}</option>`).join('')}</select>`;
  paint(`<div class="bar"><label class="f">Compare what?<select id="ck">${[['quarter','Quarter vs Quarter'],['half','Half-year (H1 / H2)'],['month','Month vs Month'],['ytd','Year to date (Apr to this month)'],['fy','Full financial year']].map(k=>`<option value="${k[0]}" ${k[0]===cmp.kind?'selected':''}>${k[1]}</option>`).join('')}</select></label><label class="f">A (blue)${sel('ca',cmp.a)}</label><label class="f">B (orange)${sel('cb',cmp.b)}</label></div>
  <div class="card"><table><tr><th>Contractor</th><th>A · ${esc(A0.t)}</th><th>B · ${esc(B0.t)}</th><th>Difference (A − B)</th><th>%</th></tr>${body}</table>
  <div class="note">${partial?`<b style="color:var(--gold2)">Not like-for-like:</b> A has data for ${nA} of ${A0.idx.length} months and B for ${nB} of ${B0.idx.length}, so the difference is not a full comparison.<br>`:''}Click Total to open contractors.${(A.lo||B.lo)?LONOTE:''}${(A.any&&!A.split)||(B.any&&!B.split)?' One side has a total only (no contractor split), so contractor differences are not shown for it.':''}</div></div>
  <div class="card" style="margin-top:14px"><div class="leg"><span><i style="background:var(--A)"></i>A · ${esc(A0.t)}</span><span><i style="background:var(--B)"></i>B · ${esc(B0.t)}</span><span class="mut">Month by month, aligned by position</span></div><svg viewBox="0 0 ${W} ${H}" width="100%" style="max-height:300px">${bars}<line x1="44" y1="${H-pad}" x2="${W-6}" y2="${H-pad}" stroke="#2a4a86"/></svg></div>`);
  $('#ck').onchange=e=>{cmp.kind=e.target.value;cmp.a=cmp.b=null;vCmp()};$('#ca').onchange=e=>{cmp.a=e.target.value;const pr=cmp.a.split('|'),ty=(+pr[0]===curFY)?curFY-1:curFY,nb=ty+'|'+pr[1];if(opts.find(o=>o.v===nb))cmp.b=nb;vCmp()};$('#cb').onchange=e=>{cmp.b=e.target.value;vCmp()};
  document.querySelectorAll('tr.par').forEach(r=>r.onclick=()=>{openSet.has('cmp')?openSet.delete('cmp'):openSet.add('cmp');vCmp()});wire2(vCmp)}

function stopPage(msg,link){$('#root').innerHTML=`<div class="big"><h2 style="color:var(--gold)">${esc(msg)}</h2><p><a class="back" href="${link||WS}">${link?'Go to the Gateway of CP':'Back to Workspace'}</a></p></div>`}
(async function(){
  const {data}=await sb.auth.getSession();
  if(!data.session){stopPage('Please log in through the Gateway of CP.',GW);return}
  try{const r=await sb.schema('core_api').rpc('me');if(r.error)throw r.error;me=r.data}catch(e){stopPage(emsg(e));return}
  try{mode=String(await API('mode_get')).toUpperCase()==='ULTRA'?'ultra':'lite'}catch(e){mode='lite'}
  if(!me||!me.active||!me.department||ALLOWED.indexOf(me.department.code)<0){stopPage('MANDAYS is only for HR & Admin, Administrator and Manager.');return}
  render()})();
</script></body></html>
