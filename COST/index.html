.top b{color:#d4ad55;font-weight:700;font-size:18px;letter-spacing:.6px}
.top .lg{display:flex;align-items:center;gap:8px}.top .lg img{height:30px;background:#fff;border-radius:5px;padding:2px 6px}
.top .so{color:#d4ad55;border:0.5px solid #8a6f2e;border-radius:7px;padding:2px 9px;cursor:pointer;font-size:12.5px;margin-left:8px}
.note{color:#aebbd8;font-size:11.5px;margin-top:3px}
.wrap{display:flex;gap:10px;padding:8px 12px;flex:1;min-height:0}
.side{width:104px;flex:none;align-self:stretch;background:rgba(7,17,42,.8);border:0.5px solid #8a6f2e;border-radius:9px;padding:6px 0}
.side div{padding:5px 10px;color:#aebbd8;cursor:pointer;border-left:2px solid transparent;font-size:13px}
.side div:hover{color:#d4ad55}
.side div.on{background:rgba(184,145,58,.16);color:#d4ad55;border-left:2px solid #b8913a}
.side .sep{border-top:0.5px solid #34487a;margin:5px 8px;padding:0;cursor:default}
.main{flex:1;min-width:0;min-height:0;overflow:auto;padding-right:2px}
h3{color:#d4ad55;font-size:14px;margin:0 0 5px;font-weight:600}
table{width:100%;border-collapse:collapse;table-layout:fixed;margin-bottom:6px}
th{background:#0f2147;color:#d4ad55;font-weight:600;padding:4px;border:0.5px solid #8a6f2e;text-align:center;font-size:12.5px}
td{background:#1e3a72;color:#e3e9f5;padding:3px 4px;border:0.5px solid #3a5694;text-align:center;font-size:12.5px;word-wrap:break-word}
td.l{text-align:left}td.rt{text-align:right}
td.r{color:#ff9a90;font-weight:600}td.g{color:#86d9a0;font-weight:600}td.w{color:#f0cf6a;font-weight:600}
tr.t td{background:#17305f;color:#d4ad55;font-weight:600;border-top:1px solid #8a6f2e}
tr.click{cursor:pointer}tr.click:hover td{background:#264a8c}
.cards{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;margin-bottom:8px}
.c{background:#0f2147;border:0.5px solid #8a6f2e;border-radius:9px;padding:5px;text-align:center}
.c b{display:block;font-size:15.5px;color:#d4ad55;font-weight:600}.c span{color:#aebbd8;font-size:11px}
.btn{display:inline-block;background:#0f2147;border:0.5px solid #8a6f2e;color:#d4ad55;border-radius:7px;padding:3px 9px;margin-right:5px;font-size:12.5px;cursor:pointer;font-family:inherit}
.btn.p{background:#1e3a72;border:1px solid #b8913a}
.btn:hover{background:#17305f}
.tabs{display:flex;gap:5px;margin-bottom:8px;flex-wrap:wrap;align-items:center}
input,select{background:#1e3a72;color:#e3e9f5;border:0.5px solid #3a5694;border-radius:6px;padding:3px 6px;font-size:13px;font-family:inherit;outline:none}
input:focus,select:focus{border-color:#d4ad55}
input[type=month],input[type=date]{color-scheme:dark}
td input{width:100%;text-align:center}
.form{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px;margin-bottom:8px}
.f{background:rgba(15,33,71,.6);border:0.5px solid #3a5694;border-radius:6px;padding:3px 6px}
.f small{display:block;color:#b8913a;font-size:11px;margin-bottom:2px}.f input,.f select{width:100%}
.drop{border:1px dashed #8a6f2e;border-radius:9px;padding:14px;text-align:center;color:#aebbd8;margin-bottom:8px}
.warn{background:rgba(184,145,58,.14);border:0.5px solid #8a6f2e;border-radius:8px;padding:5px 8px;margin-bottom:6px;color:#f0cf6a}
.ok{background:rgba(70,160,100,.14);border:0.5px solid #4c9a67;border-radius:8px;padding:5px 8px;margin-bottom:6px;color:#86d9a0}
.err{background:rgba(220,90,80,.14);border:0.5px solid #c8534a;border-radius:8px;padding:5px 8px;margin-bottom:6px;color:#ff9a90}
.ico{cursor:pointer;color:#d4ad55;margin:0 4px;font-size:14.5px}.ico:hover{color:#fff}
.bdg{display:inline-block;border-radius:8px;padding:0 6px;font-size:11px;border:0.5px solid #8a6f2e;color:#f0cf6a}
#modal{position:fixed;inset:0;background:rgba(2,8,24,.7);display:none;align-items:center;justify-content:center;z-index:60}
#modal .m{background:#0f2147;border:1px solid #8a6f2e;border-radius:12px;padding:12px;width:min(92vw,820px);max-height:86vh;overflow:auto}
#login{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:radial-gradient(900px 500px at 15% -10%,rgba(111,177,232,.20),transparent 60%),radial-gradient(800px 600px at 110% 10%,rgba(47,117,181,.22),transparent 55%),linear-gradient(180deg,#0a2150,#040c24)}
#login .box{width:100%;max-width:340px;padding:24px 26px 20px;background:linear-gradient(180deg,rgba(23,45,68,.92),rgba(11,31,51,.92));border:1px solid rgba(138,111,46,.7);border-radius:20px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.55)}
#login .box img{width:140px;background:#fff;border-radius:10px;padding:6px 12px;display:block;margin:0 auto 8px}
#login h1{margin:4px 0 2px;font-size:22px;font-weight:700;letter-spacing:.08em;color:#d4ad55}
#login .sub{font-size:12.5px;color:#aebbd8;letter-spacing:.1em;text-transform:uppercase;margin-bottom:16px}
#login label{display:block;text-align:left;margin:0 0 12px;font-size:12.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:#b8913a}
#login input{display:block;width:100%;margin-top:5px;padding:9px 11px;font-size:14.5px;border-radius:8px;border:1px solid rgba(138,111,46,.7);background:rgba(6,16,27,.6);color:#eef3f8}
#login button{width:100%;margin-top:6px;padding:10px;font-size:14.5px;font-weight:700;border:0;border-radius:8px;background:#b8913a;color:#0a1736;cursor:pointer}
#login .msg{margin-top:10px;font-size:13px;color:#ff9a90;min-height:14px}
#app{display:none;flex:1;min-height:0;flex-direction:column}#app.on{display:flex}
#loader{position:fixed;inset:0;background:rgba(2,8,24,.55);display:none;align-items:center;justify-content:center;z-index:70}
#loader img{width:84px;height:84px;animation:sp 1.1s linear infinite;filter:drop-shadow(0 0 12px rgba(217,179,65,.55))}@keyframes sp{to{transform:rotate(360deg)}}
.g3{display:grid;grid-template-columns:1fr 1.35fr 1fr;gap:10px;margin-bottom:10px}.g2{display:grid;grid-template-columns:1fr 1.35fr;gap:10px;margin-bottom:10px}
.pn2{background:rgba(15,33,71,.85);border:0.5px solid #8a6f2e;border-radius:12px;padding:10px 12px;min-width:0}
.pn2 h4{margin:0 0 7px;color:#d4ad55;font-size:13px;font-weight:600;letter-spacing:.4px;text-transform:uppercase}
.mini{background:#0f2147;border:0.5px solid #3a5694;border-radius:8px;padding:5px 8px}.mini b{display:block;font-size:15.5px;color:#d4ad55}.mini span{color:#aebbd8;font-size:11px}
.rw{display:flex;justify-content:space-between;padding:4px 0;border-bottom:0.5px solid #2c4580}
.lgd{display:flex;gap:12px;font-size:11.5px;color:#aebbd8;margin-bottom:5px}.lgd i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.live{margin-left:auto;color:#aebbd8;font-size:12.5px}.live i{display:inline-block;width:7px;height:7px;border-radius:50%;background:#46d17a;margin-right:5px;box-shadow:0 0 0 3px rgba(70,209,122,.25);animation:pl 1.6s ease-in-out infinite}@keyframes pl{50%{box-shadow:0 0 0 6px rgba(70,209,122,0)}}
@media(max-width:900px){.g3,.g2{grid-template-columns:1fr}}
.g3{display:grid;grid-template-columns:1fr 1.35fr 1fr;gap:10px;margin-bottom:10px}.g2{display:grid;grid-template-columns:1fr 1.35fr;gap:10px;margin-bottom:10px}
.pn2{background:rgba(15,33,71,.85);border:0.5px solid #8a6f2e;border-radius:12px;padding:10px 12px;min-width:0}
.pn2 h4{margin:0 0 7px;color:#d4ad55;font-size:14px;font-weight:600;letter-spacing:.4px;text-transform:uppercase}
.mini{background:#0f2147;border:0.5px solid #3a5694;border-radius:8px;padding:5px 8px}.mini b{display:block;font-size:16px;color:#d4ad55}.mini span{color:#aebbd8;font-size:11.5px}
.rw{display:flex;justify-content:space-between;padding:4px 0;border-bottom:0.5px solid #2c4580}
.lgd{display:flex;gap:12px;font-size:11.5px;color:#aebbd8;margin-bottom:5px}.lgd i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.live{margin-left:auto;color:#aebbd8;font-size:11.5px}.live i{display:inline-block;width:7px;height:7px;border-radius:50%;background:#46d17a;margin-right:5px;box-shadow:0 0 0 3px rgba(70,209,122,.25);animation:pl 1.6s ease-in-out infinite}@keyframes pl{50%{box-shadow:0 0 0 6px rgba(70,209,122,0)}}
@media(max-width:900px){.g3,.g2{grid-template-columns:1fr}}
.livebtn{display:inline-flex;align-items:center;gap:6px;background:#1e3a72;border:1px solid #46d17a;color:#86d9a0;border-radius:16px;padding:4px 14px;font-weight:700;font-size:13.5px;letter-spacing:.5px;cursor:pointer;font-family:inherit}
.livebtn:hover{background:#264a8c}.livebtn i{display:inline-block;width:8px;height:8px;border-radius:50%;background:#46d17a;animation:pl 1.6s ease-in-out infinite}
.lvtime{color:#aebbd8;font-size:11.5px;margin-left:8px}
.blink{animation:bk 1.3s ease-in-out infinite;text-shadow:0 0 14px rgba(240,207,106,.55)}@keyframes bk{0%,100%{opacity:1}50%{opacity:.3}}
.mtw{overflow:auto;padding-bottom:6px}
.mt{table-layout:auto;width:auto;min-width:100%}
.mt th,.mt td{color:#000;border:1px solid #6b7280;padding:2px 6px;font-size:12px;white-space:nowrap}
.mt td{background:#E8E8E8}.mt th.h1{background:#0B76A0;color:#fff}.mt th.h2{background:#F6C6AD}.mt th.x{background:transparent;border:0}
.mt td.qc{background:#D9F2D0;font-weight:600}.mt td.mc{background:#DCEAF7}.mt td.sp{background:#D1D1D1;text-align:left}
.mt td.sk{background:#C1E5F5}.mt td.g1{background:#D1D1D1}
.mt tr.tt td{background:#0B76A0;color:#fff;font-weight:700}
.mt td.ed{cursor:pointer}.mt td.ed:hover{outline:2px solid #b8913a}
.mt td.mn::after{content:' ✎';color:#9a6b00}.mt td.pt{font-style:italic;color:#6b4e00}
</style>
</head>

async function start(){

  const {data,error}=await sb.schema('core_api').rpc('me');if(error)throw error;

 if(d0.cutoff==null){const l=[...d0.trend].reverse().find(t=>t.cy!=null);if(l)m=l.month.slice(0,10)}

 else if(DS.q!=='all'){m=addM(fy,(DS.q-1)*3);mode='quarter'}

/* ---------------- master tabs: EXPENSES MASTER and POWER & FUEL MASTER ---------------- */
const MFULL=['April','May','June','July','August','September','October','November','December','January','February','March'];
const MABBR=['AMJ','JAS','OND','JFM'];
const MCAT=[['labour','labour cost'],['power_fuel','Power & fuel'],['consumable','Consumable'],['repair','Repair & Maintenance'],['safety','Safety']];
const MPAL={blue:'0B76A0',peach:'F6C6AD',green:'D9F2D0',navy:'DCEAF7',grey1:'D1D1D1',grey0:'E8E8E8',sky:'C1E5F5'};
const MS={fy:null,fys:[],basis:'same',data:null,map:{}};
try{MS.basis=localStorage.getItem('cpMasterBasis')==='billed'?'billed':'same'}catch(e){}
const lastDay=m=>new Date(Date.UTC(+m.slice(0,4),+m.slice(5,7),0)).toISOString().slice(0,10);
const sumN=a=>{const v=a.filter(x=>x!=null&&!isNaN(x));return v.length?v.reduce((s,x)=>s+Number(x),0):null};
const divN=(a,b)=>a==null||b==null||!Number(b)?null:Number(a)/Number(b);
const subN=(a,b)=>a==null&&b==null?null:Number(a||0)-Number(b||0);
const fx=(x,d)=>x==null||isNaN(x)?'-':n(x,d);
async function masterLoad(){
 if(!MS.fys.length){MS.fys=(await R('cost_years')).map(x=>x.slice(0,10));const cur=fyOf(new Date().toISOString().slice(0,10));MS.fy=MS.fys.includes(cur)?cur:MS.fys[MS.fys.length-1]}
 MS.data=await R('master_get',{p_fy:MS.fy});MS.map={};MS.data.rows.forEach(r=>MS.map[r.month]=r);
}
function mval(m,k){const r=MS.map[m];if(!r)return null;
 const pw=MS.basis==='billed'?r.power_billed:r.power;
 if(k==='power')return pw==null?null:Number(pw);
 if(k==='diesel')return r.diesel==null?null:Number(r.diesel);
 if(k==='power_fuel'){if(pw==null&&r.diesel==null)return null;return Number(pw||0)+Number(r.diesel||0)}
 return r[k]==null?null:Number(r[k]);
}
const mths=fy=>[...Array(12)].map((_,i)=>addM(fy,i));
/* one figure cell: manual marker, partial marker, click to edit */
function mtd(m,f,val,o){o=o||{};const r=MS.map[m];if(!r)return '<td>-</td>';
 const key={power_fuel:'power_fuel',power:'power_fuel',diesel:'power_fuel'}[f]||f;
 const srcKey=f;const manual=r.src&&r.src[srcKey]==='manual';
 const th=r.through&&r.through[key];const partial=val!=null&&(!th||th<lastDay(m));
 const edit=!!(MS.data.can_edit&&o.edit&&!r.locked&&!(MS.basis==='billed'&&(f==='power')));
 const cls=[o.cls||'',manual?'mn':'',partial?'pt':'',edit?'ed':''].filter(Boolean).join(' ');
 const tip=r.locked?'Month locked':manual?'Typed manually':partial?('Data up to '+(th?dl(th):'-')):'';
 return `<td class="${cls}"${tip?` title="${tip}"`:''}${edit?` data-m="${m}" data-f="${f}" data-v="${val==null?'':val}"`:''}${o.rs?` rowspan="${o.rs}"`:''}>${o.fmt?o.fmt(val):fx(val,o.d||0)}</td>`;
}
/* ---- block builders (shared by screen and Excel) ---- */
function expModel(fy){ /* per month: categories + production */
 return mths(fy).map(m=>({m,cat:Object.fromEntries(MCAT.map(c=>[c[0],mval(m,c[0])])),tins:mval(m,'tins')}));
}
function qTotals(model,q){const ms=model.slice(q*3,q*3+3);
 return {exp:sumN(ms.flatMap(x=>Object.values(x.cat))),tins:sumN(ms.map(x=>x.tins))}}
function yTotals(model){return {exp:sumN(model.flatMap(x=>Object.values(x.cat))),tins:sumN(model.map(x=>x.tins))}}

 <button class="btn p" id="mdl">Download Excel</button></div>

function expTable(){
 const a=MS.data.fy,b=MS.data.prev,mp=expModel(b),mc=expModel(a);
 const cmp=(e1,t1,e2,t2)=>{const c1=divN(e1,t1),c2=divN(e2,t2);return `<td>${fx(subN(e1,e2))}</td><td>${fx(subN(t1,t2))}</td><td>${fx(c1==null||c2==null?null:c1-c2,3)}</td>`};
 const tot=(label,P,C)=>`<tr class="tt"><td colspan="3">${label}</td><td>${fx(P.exp)}</td><td>${fx(P.tins)}</td><td>${fx(divN(P.exp,P.tins),3)}</td><td>${fx(C.exp)}</td><td>${fx(C.tins)}</td><td>${fx(divN(C.exp,C.tins),3)}</td>${cmp(P.exp,P.tins,C.exp,C.tins)}</tr>`;
 let h=`<table class="mt"><tr><th colspan="3" class="x"></th><th colspan="3" class="h1">${FYL(b).replace('FY','FINANCIAL YEAR')}</th><th colspan="3" class="h1">${FYL(a).replace('FY','FINANCIAL YEAR')}</th><th colspan="3" class="h1">COMPARISON (${FYL(b).slice(3)} vs ${FYL(a).slice(3)})</th></tr>
 <tr><th class="h2">QUARTER</th><th class="h2">MONTH</th><th class="h2">EXPENSES SPLIT</th>${['EXPENSES','PRODUCTION QTY','COST/TIN'].concat(['EXPENSES','PRODUCTION QTY','COST/TIN'],['EXPENSES','PRODUCTION QTY','COST/TIN']).map(x=>`<th class="h2">${x}</th>`).join('')}</tr>`;
 for(let q=0;q<4;q++){
  for(let i=0;i<3;i++){const k=q*3+i,P=mp[k],C=mc[k];
   MCAT.forEach((c,ci)=>{const cat=c[0];
    const pe=P.cat[cat],ce=C.cat[cat];const ed=cat!=='power_fuel';
    const ptn=divN(pe,P.tins),ctn=divN(ce,C.tins);
    h+='<tr>'+(i===0&&ci===0?`<td class="qc" rowspan="15">Q${q+1}</td>`:'')+(ci===0?`<td class="mc" rowspan="5">${MFULL[k]}</td>`:'')+`<td class="sp">${c[1]}</td>`
     +mtd(P.m,cat,pe,{edit:ed})+(ci===0?mtd(P.m,'tins',P.tins,{edit:true,rs:5}):'')+`<td>${fx(ptn,3)}</td>`
     +mtd(C.m,cat,ce,{edit:ed})+(ci===0?mtd(C.m,'tins',C.tins,{edit:true,rs:5}):'')+`<td>${fx(ctn,3)}</td>`
     +`<td>${fx(subN(pe,ce))}</td>`+(ci===0?`<td rowspan="5">${fx(subN(P.tins,C.tins))}</td>`:'')+`<td>${fx(ptn==null||ctn==null?null:ptn-ctn,3)}</td></tr>`;
   });
  }
  h+=tot('Q'+(q+1)+' TOTAL',qTotals(mp,q),qTotals(mc,q));
 }
 h+=tot('FINANCIAL YEAR TOTAL',yTotals(mp),yTotals(mc))+'</table>';
 return h;
}
function pfTable(){
 const a=MS.data.fy,b=MS.data.prev,P=mths(b),C=mths(a);

async function xlDownload(name,sheet){
 const wb=new ExcelJS.Workbook();const ws=wb.addWorksheet(sheet.name);
 const hr=ws.addRow(sheet.head);
 sheet.rows.forEach(r=>ws.addRow(r));
 ws.eachRow((row,i)=>{row.eachCell({includeEmpty:true},c=>{c.border={top:{style:'thin'},left:{style:'thin'},bottom:{style:'thin'},right:{style:'thin'}};c.alignment={horizontal:'center',vertical:'middle'};
  if(i===1){c.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FF0F2147'}};c.font={bold:true,color:{argb:'FFD4AD55'}}}})});
 ws.columns.forEach((c,i)=>c.width=sheet.widths?sheet.widths[i]:16);
 const buf=await wb.xlsx.writeBuffer();const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}
function previewSheet(title,name,sheet){
 const val=c=>c&&typeof c==='object'&&'result' in c?c.result:c;
 showModal(`<h3>${esc(title)}: preview</h3><table><tr>${sheet.head.map(h=>`<th>${esc(h)}</th>`).join('')}</tr>${sheet.rows.map(r=>`<tr>${r.map(c=>`<td>${esc(val(c)==null?'':val(c))}</td>`).join('')}</tr>`).join('')}</table>
 <button class="btn p" id="dl">Download Excel</button><button class="btn" id="cl">Close</button>`);
 $('#cl').onclick=()=>$('#modal').style.display='none';

}

  const rows=d.rows.map((r,i)=>{const x=i+2;return [r.base_name,r.invoiced==null?'':Number(r.invoiced),r.payroll_subtotal==null?'':Number(r.payroll_subtotal),r.payroll_with_gst==null?'':Number(r.payroll_with_gst),{formula:`IF(AND(ISNUMBER(B${x}),ISNUMBER(C${x})),B${x}-C${x},"")`,result:r.difference==null?'':Number(r.difference)},{formula:`IF(AND(ISNUMBER(C${x}),C${x}<>0,ISNUMBER(B${x})),(B${x}-C${x})/C${x},"")`,result:r.diff_pct==null?'':r.diff_pct/100},r.state==='ok'?'Matched':r.state==='no_payroll'?'No payroll data':'Invoice pending']});
  previewSheet('Labour match',`Labour_match_${S.month}.xlsx`,{name:'Labour match',head:['Contractor','Invoiced (register)','Payroll (before GST)','Payroll (with GST)','Difference','Diff %','Status'],rows,widths:[22,18,20,18,16,10,18]})}catch(e){toast(em(e),'err')}};
 $('#r3').onclick=async()=>{try{const d=await R('daily_view',{p_month:ms()});
  const rows=d.rows.map((r,i)=>{const x=i+2;return [dl(r.date),Number(r.mandays)||0,Number(r.labour)||0,Number(r.repair)||0,Number(r.safety)||0,Number(r.consumable)||0,Number(r.fuel)||0,Number(r.power)||0,r.tins==null?'':Number(r.tins),{formula:`IF(AND(ISNUMBER(I${x}),I${x}>0),SUM(C${x}:H${x})/I${x},"")`,result:r.tins>0?(['labour','repair','safety','consumable','fuel','power'].reduce((a,k)=>a+(Number(r[k])||0),0))/r.tins:''}]});
  previewSheet('Daily view',`Daily_view_${S.month}.xlsx`,{name:'Daily view',head:['Date','Mandays','Labour','Repair','Safety','Consumable','Fuel','Power','Tins','Per tin'],rows,widths:[12,10,14,12,12,12,12,12,12,10]})}catch(e){toast(em(e),'err')}};
};
