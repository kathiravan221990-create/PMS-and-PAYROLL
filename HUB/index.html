<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CP HUB</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--gold:#d9b341;--gold2:#f0cf6a;--navy:#07173a;--panel:#0f2d63;--lt:#e8eefc;--ok:#0b6b3a;--bad:#a4161a}
*{box-sizing:border-box}html,body{min-height:100%}
body{margin:0;font:14px/1.45 "Segoe UI",Roboto,Arial,sans-serif;color:var(--lt);background:linear-gradient(180deg,#3d86d6 0%,#1d4f9a 35%,#0a2150 100%) fixed}
.wrap{max-width:1100px;margin:0 auto;padding:22px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:22px}
.top .l{display:flex;align-items:center;gap:14px}
.logo{background:#fff;border-radius:12px;padding:6px 12px}.logo img{height:54px;display:block}
h1{margin:0;font-size:22px;color:var(--gold2);letter-spacing:2px}.sub{font-size:12px;color:#cfe0ff}
.who{display:flex;align-items:center;gap:10px;font-size:13px}
button,.b{font:inherit;cursor:pointer;border-radius:9px;border:1px solid var(--gold);background:transparent;color:var(--gold2);padding:8px 14px}
button:hover,.b:hover{background:var(--gold);color:#000}
.b.g{background:var(--gold);color:#000;font-weight:700;border-color:var(--gold)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.tile{background:linear-gradient(150deg,#143a78,#0a2150);border:1px solid rgba(240,207,106,.55);border-left:6px solid var(--gold);border-radius:14px;padding:20px;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.35);transition:.15s}
.tile:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(0,0,0,.45)}
.tile h2{margin:0 0 6px;color:var(--gold2);font-size:19px;letter-spacing:1px}.tile p{margin:0;color:#cfe0ff;font-size:13px}
.tile .ic{font-size:30px;margin-bottom:8px}
.card{background:linear-gradient(150deg,#143a78,#0a2150);border:1px solid rgba(240,207,106,.45);border-radius:14px;padding:18px;margin-top:18px}
.card h2{margin:0 0 10px;color:var(--gold2)}
table{width:100%;border-collapse:collapse}th,td{padding:8px 10px;border-bottom:1px solid rgba(240,207,106,.25);text-align:left;vertical-align:middle}th{color:var(--gold2);font-size:12px;letter-spacing:.5px}
input,select{font:inherit;padding:8px 10px;border-radius:8px;border:1px solid #c9b25a;background:#fff5c9;color:#000;width:100%}
label{display:block;font-size:12px;color:#cfe0ff;margin-bottom:10px}
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login{width:100%;max-width:380px;background:linear-gradient(150deg,#143a78,#0a2150);border:1px solid var(--gold);border-radius:16px;padding:26px;text-align:center;box-shadow:0 12px 36px rgba(0,0,0,.5)}
.login label{text-align:left}.login h1{font-size:22px;margin:6px 0 2px}
.msg{margin-top:10px;padding:8px 10px;border-radius:8px;background:rgba(164,22,26,.25);border:1px solid #e07070;color:#ffd6d6;font-size:13px;text-align:left}
.ok{background:rgba(11,107,58,.3);border-color:#4cc78a;color:#d6ffe8}
.mut{color:#cfe0ff;font-size:12px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}.row>*{flex:1;min-width:140px}.row .b,.row button{flex:none}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#000;color:var(--gold2);padding:10px 18px;border-radius:10px;border:1px solid var(--gold);display:none;z-index:50}
</style></head><body><div id="app"></div><div id="toast"></div>

const role=r=>ME&&ME.roles&&ME.roles[r];
const perm=(m,p)=>ME&&ME.permissions&&(ME.permissions[m]||[]).includes(p);
const canSee=l=>{if(!ME)return false;if(role('core')==='admin')return true;if(l.role==='quality')return !!(role('quality')||role('pms'));return !!role(l.role)};
function showLogin(msg){
 $('#app').innerHTML=`<div class="login-wrap"><div class="login"><div class="logo" style="display:inline-block"><img src="${LOGO}" alt="Classic Pack" style="height:90px"></div><h1>${esc(HUB_NAME)}</h1><div class="sub" style="margin-bottom:14px">Sign in to continue</div>
 <label>User ID<input id="em" autocomplete="username" autocapitalize="off" placeholder="Enter your User ID"></label>
 <label>Password<input id="pw" type="password" autocomplete="current-password" placeholder="Enter your password"></label>
 <button class="b g" id="go" style="width:100%">Log in</button>${msg?`<div class="msg">${esc(msg)}</div>`:''}</div></div>`;
 const go=async()=>{const u=$('#em').value.trim().split('@')[0].replace(/\s/g,'').toLowerCase();if(!u)return showLogin('Enter your User ID');
  const {error}=await sb.auth.signInWithPassword({email:u+'@classicpack.com',password:$('#pw').value});if(error)return showLogin('Wrong User ID or password');start()};
 $('#go').onclick=go;$('#pw').onkeydown=e=>{if(e.key==='Enter')go()}}
async function loadLinks(){const {data,error}=await C('portal_links_list');LINKS=(!error&&Array.isArray(data)&&data.length)?data:[]}
function tiles(){
 const defs=DEFAULTS.map(d=>{const o=LINKS.find(l=>l.code===d.code);return {...d,url:o?.url||d.url,title:o?.title||d.title,active:o?o.active!==false:true}});
 const extra=LINKS.filter(l=>!DEFAULTS.some(d=>d.code===l.code)&&l.active!==false).map(l=>({code:l.code,title:l.title,desc:'',icon:'🔗',url:l.url,role:l.role||'pms'}));
 return defs.concat(extra).filter(l=>l.active!==false&&canSee(l))}
function home(){
 const t=tiles();const admin=role('core')==='admin';
 const sys=[];if(admin||perm('core','manage_ips'))sys.push(['ips','IP Security','🛡️','Allowed networks - your office IPs']);
 if(admin)sys.push(['links','Portal Links','🔗','Change an app link when it moves']);
 $('#app').innerHTML=`<div class="wrap"><div class="top"><div class="l"><div class="logo"><img src="${LOGO}" alt=""></div><div><h1>${esc(HUB_NAME)}</h1><div class="sub">Classic Pack Pvt Ltd</div></div></div>
 <div class="who"><span>${esc(ME.full_name||'')}</span><button id="lo">Log out</button></div></div>
 <div class="tiles">${t.map(l=>`<div class="tile" data-u="${esc(l.url)}"><div class="ic">${tIcon(l)}</div><h2>${esc(l.title)}</h2><p>${esc(l.desc||'')}</p></div>`).join('')}
 ${sys.map(s=>`<div class="tile" data-v="${s[0]}"><div class="ic">${s[2]}</div><h2>${s[1]}</h2><p>${s[3]}</p></div>`).join('')}</div>
 ${t.length||sys.length?'':'<div class="card">No application is assigned to your login yet. Ask the Administrator.</div>'}<div id="sub"></div></div>`;
 document.querySelectorAll('[data-u]').forEach(e=>e.onclick=()=>e.dataset.u?location.href=e.dataset.u:toast('Link not set yet - Administrator can add it in Portal Links'));
 document.querySelectorAll('[data-v]').forEach(e=>e.onclick=()=>({ips:ipsView,links:linksView})[e.dataset.v]());
 $('#lo').onclick=async()=>{await sb.auth.signOut();ME=null;showLogin()}}
async function linksView(){
 await loadLinks();const all=DEFAULTS.map(d=>{const o=LINKS.find(l=>l.code===d.code)||{};return {code:d.code,title:o.title||d.title,url:o.url||d.url,active:o.active!==false}}).concat(LINKS.filter(l=>!DEFAULTS.some(d=>d.code===l.code)));
 $('#sub').innerHTML=`<div class="card"><h2>Portal Links</h2><div class="mut" style="margin-bottom:10px">Change a link here when an app moves to a new address. Tiles update for everyone after Save.</div>
 <table><tr><th>Name</th><th>Link</th><th>Show</th><th></th></tr>${all.map((l,i)=>`<tr><td><input id="t${i}" value="${esc(l.title)}"></td><td><input id="u${i}" value="${esc(l.url)}"></td><td><input id="a${i}" type="checkbox" ${l.active?'checked':''} style="width:auto"></td><td><button data-s="${i}">Save</button></td></tr>`).join('')}</table>
 <div class="mut" style="margin:14px 0 6px">Add another link</div><div class="row"><label>Name<input id="nt"></label><label>Link (https://...)<input id="nu"></label><button class="b g" id="na">Add</button></div></div>`;
 const save=async(code,title,url,active)=>{if(!/^https:\/\//i.test(url))return toast('Link must start with https://');const {error}=await C('portal_link_save',{p_code:code,p_title:title,p_url:url,p_active:active});if(error)return toast(cleanErr(error.message));toast('Saved');await loadLinks();home();linksView()};
 document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{const i=+b.dataset.s;save(all[i].code,$('#t'+i).value.trim(),$('#u'+i).value.trim(),$('#a'+i).checked)});
 $('#na').onclick=()=>{const t=$('#nt').value.trim(),u=$('#nu').value.trim();if(!t||!u)return toast('Enter name and link');save(t.toLowerCase().replace(/[^a-z0-9]+/g,'-'),t,u,true)};
 $('#sub').scrollIntoView({behavior:'smooth'})}
async function ipsView(){
 const {data,error}=await C('allowed_ips_list');if(error)return toast(cleanErr(error.message));
 const my=(data.find(x=>x.your_ip)||{}).your_ip||'unknown',rows=data.filter(x=>!x.your_ip);
 $('#sub').innerHTML=`<div class="card"><h2>IP Security</h2><div class="mut" style="margin-bottom:8px">Your current IP: <b style="color:#f0cf6a">${esc(my)}</b>. ${rows.some(r=>r.active)?'Only the networks below can log in to PMS, Payroll and Quality.':'<b>No network is listed, so logins are allowed from anywhere.</b> Add your office IPs to switch the restriction on.'}</div>
 <table><tr><th>Label</th><th>IP / range</th><th>Active</th><th></th></tr>${rows.map(r=>`<tr><td>${esc(r.label)}</td><td>${esc(r.cidr)}</td><td>${r.active?'Yes':'No'}</td><td><button data-t="${r.id}">${r.active?'Disable':'Enable'}</button></td></tr>`).join('')||'<tr><td colspan="4" class="mut">No entries</td></tr>'}</table>
 <div class="mut" style="margin:14px 0 6px">Add a network</div><div class="row"><label>Label<input id="il" placeholder="e.g. Office Airtel"></label><label>IP address<input id="ic" placeholder="e.g. 223.178.82.127"></label><button class="b g" id="ia">Add</button><button id="ima">Add my IP</button></div>
 <div class="mut" style="margin-top:8px">Warning: adding a list switches the restriction on. Add your own IP first so you are not locked out (Administrators with the bypass rule on can still log in).</div></div>`;
 const add=async(c,l)=>{if(!c||!l)return toast('Enter label and IP');const {error}=await C('allowed_ip_save',{p_id:null,p_cidr:c.includes('/')?c:c+'/32',p_label:l,p_active:true});if(error)return toast(cleanErr(error.message));toast('Added');ipsView()};
 $('#ia').onclick=()=>add($('#ic').value.trim(),$('#il').value.trim());$('#ima').onclick=()=>add(my,$('#il').value.trim()||'My IP');
 document.querySelectorAll('[data-t]').forEach(b=>b.onclick=async()=>{const r=rows.find(x=>String(x.id)===b.dataset.t);const {error}=await C('allowed_ip_save',{p_id:r.id,p_cidr:r.cidr,p_label:r.label,p_active:!r.active});if(error)return toast(cleanErr(error.message));ipsView()});
 $('#sub').scrollIntoView({behavior:'smooth'})}
async function start(){
 const {data:s}=await sb.auth.getSession();if(!s.session)return showLogin();
 const {data,error}=await C('me');if(error){await sb.auth.signOut();return showLogin(cleanErr(error.message))}
 ME=data;await loadLinks();home()}
start();
</script></body></html>
